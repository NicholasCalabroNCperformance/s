    if(i===ultima) s+='<text class="d-v" x="'+(cx+wd/2)+'" y="'+(ys(Math.max(x.p,x.f))-5)+'" text-anchor="middle">'+x.f+'/'+x.p+'</text>';
    s+='<rect class="d-hit" data-i="'+i+'" x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B+18)+'" fill="transparent"/>';});
  s+='</svg>';
  const sv=el("div","d-svg",s); box.appendChild(sv);
  sv.querySelectorAll(".d-hit").forEach(function(h){h.addEventListener("click",function(ev){ev.stopPropagation();
    const i=+h.dataset.i,x=sps[i],r=sv.getBoundingClientRect(),sc=r.width/W;
    tip(sv,(L+i*bw+bw/2)*sc,ys(Math.max(x.p,x.f))*sc,'<b>S'+x.w+'</b>'+x.f+' serie fatte su '+x.p+(x.p?' · '+Math.round(x.f*100/x.p)+'%':''))})});

    h+='<li><b>Apri questa pagina in Chrome.</b> Da WhatsApp o da un\u2019altra app l\u2019installazione non c\u2019\u00e8.'+
      '<div class="riga"><button onclick="apriChrome()">Apri in Chrome</button>'+
      '<button class="no" onclick="copiaLink(this)">Copia il link</button></div></li>'+
      '<li>In Chrome tocca i <b>tre puntini</b> in alto a destra</li>'+
      '<li>Scegli <b>Installa app</b> <span class="pic">(oppure \u00abAggiungi a schermata Home\u00bb)</span></li>'+
      '<li>Conferma</li></ol>';
    p.innerHTML=h; return;
  }
  if(inAppBrowser()){
    h+='<li><b>Prima apri questa pagina in Safari.</b> Da WhatsApp e dalle altre app '+
      'l’installazione non esiste: serve Safari.<br>'+
      '<span class="pic">Cerca in basso il tasto con i tre puntini o la bussola e scegli '+
      '«Apri in Safari». Oppure copia il link qui sotto e incollalo in Safari.</span>'+
      '<div class="riga"><button onclick="apriSafari()">Apri in Safari</button>'+
      '<button class="no" onclick="copiaLink(this)">Copia il link</button></div></li>';
  }
  /* iPhone di adesso: in Safari il tasto Condividi sta dentro i tre puntini in basso a destra; sugli iPhone piu'
     vecchi e' l'icona Condividi nella barra in fondo. Si dicono tutte e due (richiesta del coach 2026-11-04) */
  h+='<li>In Safari tocca i <b>tre puntini</b> <span class="ic">'+SVGPUNTINI+'</span> <b>in basso a destra</b>, '+
    'accanto all\u2019indirizzo.<br><span class="pic">Non li vedi? Tocca una volta il fondo dello schermo: la barra ricompare. '+
    'Su un iPhone meno recente al posto dei tre puntini c\u2019\u00e8 direttamente il tasto Condividi '+
    '<span class="ic">'+SVGCOND+'</span> in fondo allo schermo: tocca quello e salta il passo 2.</span></li>'+
    '<li>Nel menu tocca <b>Condividi</b> <span class="ic">'+SVGCOND+'</span></li>'+
    '<li>Scorri l\u2019elenco verso il basso e scegli <b>Aggiungi alla schermata Home</b> '+
    '<span class="pic">(in inglese: Add to Home Screen). Se non c\u2019\u00e8, tocca \u00abAltro\u00bb in fondo all\u2019elenco.</span></li>'+
    '<li>Se c\u2019\u00e8 \u00abApri come app web\u00bb, lascialo acceso. Poi tocca <b>Aggiungi</b> in alto a destra</li></ol>';
  if(!inAppBrowser())
    h+='<div class="riga"><button class="no" onclick="copiaLink(this)">Copia il link</button></div>';
  p.innerHTML=h;
}
function copiaLink(b){
  const u=location.origin+location.pathname;
  function fatto(){b.textContent="Copiato ✓"; setTimeout(function(){b.textContent="Copia il link"},2500)}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(fatto).catch(function(){prompt("Copia il link:",u)});
  } else { prompt("Copia il link:",u) }
}
function apriChrome(){
  location.href="intent://"+location.host+location.pathname+"#Intent;scheme=https;package=com.android.chrome;end";
}
function apriSafari(){
  location.href="x-safari-"+location.origin+location.pathname;
}
function installa(){
  if(!PROMPT) return;
  PROMPT.prompt();
  PROMPT.userChoice.then(function(){PROMPT=null;
    const e=document.getElementById("inst"); if(e) e.style.display="none"});
}
function nienteInstalla(){
  try{localStorage.setItem("ncp-no-inst","1")}catch(e){}
  const e=document.getElementById("inst"); if(e) e.style.display="none";
}
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); PROMPT=e; mostraInstalla("android")});
(function(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  setTimeout(function(){
    if(!giaInstallata()&&!PROMPT) mostraInstalla(ios?"ios":"altro");
  },900);
})();


</script></body></html>
