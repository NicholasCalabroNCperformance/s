<!doctype html><html lang="it"><head><meta charset="utf-8">

<title>Blocco tecnico S1-S5</title><style>
:root{--paper:#F1F1F2;--card:#FFF;--alt:#E9E9EB;--band:#DBDBDE;--line:#CFCFD4;
--gold:#A9863B;--gold2:#C9A961;--ink:#23232A;--mute:#6E6E78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--paper:#17171A;--card:#1F1F23;--alt:#232328;--band:#2A2A31;--line:#35353D;
--gold:#C9A961;--gold2:#A9863B;--ink:#EDEDEF;--mute:#9A9AA4}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%;
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 60px}
header{padding:22px 0 14px;border-bottom:2px solid var(--gold)}
.mono{font:700 12px/1 Georgia,serif;letter-spacing:.34em;color:var(--gold)}
h1{font:400 23px/1.25 Georgia,serif;margin:9px 0 3px}
.sub{color:var(--mute);font-size:13.5px}
.rif{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:16px 0;padding:13px 15px}
.rif h2{font:700 11px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;color:var(--mute)}
.rif .r{display:flex;align-items:center;gap:9px;padding:6px 0}
.rif .r label{flex:1;font-size:14.5px}
.rif .r .tag{font-size:11.5px;color:var(--mute)}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);
border-radius:7px;padding:7px 9px}
input[type=number]{width:88px;text-align:right;font-variant-numeric:tabular-nums}
input:focus{outline:2px solid var(--gold2);outline-offset:1px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0}
.btns button{font:600 14px/1 -apple-system,sans-serif;padding:10px 15px;border-radius:8px;
border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
@media print{.btns,nav,.wkbar{display:none}body{background:#fff}}

.wkbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0 10px;margin:0 -14px;
padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
.wkbar .lab{font:700 10.5px/1 -apple-system,sans-serif;letter-spacing:.14em;color:var(--mute);
text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{font:700 15px/1 -apple-system,sans-serif;padding:12px 0;width:56px;border-radius:9px;
border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.chips button.all{width:auto;padding:12px 16px;font-size:13px;letter-spacing:.06em}
.chips button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#fff}
.daybar{background:var(--gold);color:#fff;padding:13px 14px;margin:26px -14px 12px;
font:700 13px/1 -apple-system,sans-serif;letter-spacing:.22em;
display:flex;justify-content:space-between;align-items:center}
.daybar span{font:400 11.5px/1 -apple-system,sans-serif;letter-spacing:.04em;opacity:.85}
.daybar:first-of-type{margin-top:14px}
.row2{margin-top:10px}
.ex{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
border-radius:8px;margin:0 0 12px;overflow:hidden}
.ex>h3{font:600 15.5px/1.3 Georgia,serif;margin:0;padding:11px 13px 10px;border-bottom:1px solid var(--line)}
.ex>h3 em{display:block;font:400 12px/1.3 -apple-system,sans-serif;font-style:normal;color:var(--gold);
font-weight:700;letter-spacing:.03em;margin-top:3px}
.wk{display:grid;grid-template-columns:44px 1fr 118px;gap:3px 10px;align-items:baseline;
padding:10px 13px;border-bottom:1px solid var(--line)}
.wk:nth-child(even){background:var(--alt)}.wk:last-child{border-bottom:0}
.wk.solo{grid-template-columns:1fr 128px}
.wk .s{font:700 12.5px/1.4 -apple-system,sans-serif;color:var(--mute)}
.wk .sch{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wk .rec{margin-left:auto;display:inline-flex;align-items:baseline;gap:6px;max-width:64%;
text-align:right;line-height:1.35;
background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;
font:700 13.5px/1 -apple-system,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.wk .rec em{font:700 8.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.11em;
text-transform:uppercase;color:var(--mute)}
.wk .recw{grid-column:1/-1;display:flex;justify-content:flex-end;margin-bottom:2px}
.wk .recw .rec{margin-left:0}
.wk .sch .n{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.wk .sch .n b{font:600 17px/1.15 -apple-system,sans-serif;font-variant-numeric:tabular-nums}
.wk .sch .n em{font:700 8.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.11em;
text-transform:uppercase;color:var(--mute);margin-top:3px}
.wk .sch .x{font:400 14px/1 -apple-system,sans-serif;color:var(--mute);padding-bottom:12px}
.wk .car{text-align:right;font:700 17px/1.2 -apple-system,sans-serif;color:var(--gold);
font-variant-numeric:tabular-nums}
.wk .car .raw{display:block;font:400 11px/1.3 -apple-system,sans-serif;color:var(--mute)}
.wk .car .wait{font:600 12px/1.3 -apple-system,sans-serif;color:var(--mute)}
.wk .car input{width:100%;min-width:92px;font-size:14px;padding:6px 8px;text-align:right}
.wk .car input.free{text-align:left;font-size:14.5px;padding:8px 10px}
.wk .multi{grid-column:1/-1}
.wk .parte{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0 10px}
.wk .parte:first-child{padding-top:2px}
.wk .parte .sch{flex:0 0 auto}
.wk .parte .car{text-align:right;font:700 17px/1.2 -apple-system,sans-serif;color:var(--gold);
font-variant-numeric:tabular-nums;min-width:0}
.wk .poi{font:400 11px/1 -apple-system,sans-serif;color:var(--mute);margin:0;
letter-spacing:.1em;text-transform:uppercase;border-top:1px dashed var(--line);
padding-top:9px;padding-left:1px}
.wk .rec2{font:400 12.5px/1 -apple-system,sans-serif;color:var(--mute);margin-top:5px}
.wk .at{font:700 17px/1.2 -apple-system,sans-serif;color:var(--gold)}
.wk .parte .car input{width:88px;font-size:14px;padding:6px 8px;text-align:right}
.wk .nota{grid-column:1/-1;font-size:13.5px;color:var(--mute);margin-top:3px}
.wk .app{grid-column:1/-1;margin-top:7px}
.wk .app input{width:100%;font-size:14px;padding:7px 9px}
.wk .app span{display:block;font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;
color:var(--mute);text-transform:uppercase;margin-bottom:4px}
@media(max-width:560px){.wk{grid-template-columns:44px 1fr}.wk.solo{grid-template-columns:1fr}
.wk .car{grid-column:1/-1;text-align:left;margin-top:3px}.wk .car .raw{display:inline;margin-left:8px}}
</style></head><body><div class="wrap">

function stepOf(id){const r=REFS.find(x=>x.id===id);return r?r.step:2.5}
function ancOf(id){const r=REFS.find(x=>x.id===id);return r&&r.anc?' '+r.anc:''}
function ref(id){const v=parseFloat(state["ref_"+id]);return isFinite(v)&&v>0?v:null}
function q(x,st){st=st||2.5;return Math.ceil(x/st-0.5)*st}
function f(x){return (Math.round(x*100)/100).toString().replace(".",",")}
function pcts(s){ // estrae i numeri % da una cella
  const m=String(s).match(/\d+(?:[.,]\d+)?(?=\s*[-–]\s*\d|\s*%)/g);
  return m?m.map(x=>parseFloat(x.replace(",","."))):[];
}
function partsOf(r){
  const se=String(r.se||"").split("/").map(x=>x.trim());
  if(se.length<2) return null;
  const rp=String(r.rp||"").split("/").map(x=>x.trim());
  const pc=String(r.pc||"").split("/").map(x=>x.trim());
  return se.map((x,i)=>({se:x, rp:(rp[i]!==undefined?rp[i]:rp[0]), pc:(pc[i]!==undefined?pc[i]:"")}));
}
function schema(r){
  const rp=String(r.rp||"").trim();
  const lab=/^\d+\s*s$/i.test(rp)?"tenuta":(rp==="—"?"":"colpi");
  return '<span class="n"><b>'+r.se+'</b><em>serie</em></span>'+
         (lab?'<span class="x">×</span><span class="n"><b>'+rp+'</b><em>'+lab+'</em></span>':'');
}
function caricoParte(p,b,k,i){
  const pc=String(p.pc||"").trim(), st=b.lift?stepOf(b.lift):2.5, tk="top_"+k;
  if(/^RPE/i.test(pc)&&!/%/.test(pc)){
    return '<span class="at">'+pc.replace(/^RPE\s*/i,"@")+'</span>'+
      ' <input type="number" step="2.5" inputmode="decimal" data-k="'+tk+'" data-pct="" data-st="'+st+
      '" value="'+esc(state[tk]||"")+'" placeholder="kg">';
  }
  if(/del top/i.test(pc)){
    const a=pcts(pc), pct=a.length?a[a.length-1]:null;
    return '<span id="o_'+tk+'_'+i+'">'+topOut(tk,pct,st)+'</span><span class="raw">'+pc+'</span>';
  }
  const R=b.lift?ref(b.lift):null, a=pcts(pc);
  if(R&&a.length) return f(q(R*a[0]/100,st))+' kg<span class="raw">'+pc+ancOf(b.lift)+'</span>';
  if(pc) return '<span class="wait">'+pc+'</span>';
  return '';
}
function topOut(tk,pct,st){const tv=parseFloat(state[tk]);
  return (isFinite(tv)&&tv>0&&pct)?'<b>'+f(q(tv*pct/100,st))+' kg</b>':'<span class="wait">dopo il top</span>';}
function carico(r,b,k,raw){
  if(raw===undefined)raw=true;
  const pc=String(r.pc||"").trim(), orig=String(r.ca||"").trim();
  // back-off su un top trovato in seduta
  if(/del top/i.test(pc)){
    const p=pcts(pc), pct=p.length?p[p.length-1]:null;
    const tk="top_"+k, st=b.lift?stepOf(b.lift):2.5;
    return '<input type="number" step="2.5" inputmode="decimal" data-k="'+tk+'" data-pct="'+(pct||"")+
           '" data-st="'+st+'" value="'+esc(state[tk]||"")+'" placeholder="top"> '+
           '<span class="raw"><span id="o_'+tk+'">'+topOut(tk,pct,st)+'</span> &middot; '+pc+'</span>';
  }
  const R=b.lift?ref(b.lift):null, p=pcts(pc), st=b.lift?stepOf(b.lift):2.5;
  if(R&&p.length){
    const isRange=/\d\s*[-–]\s*\d/.test(pc);
    const vals=p.map(x=>isRange?f(Math.round(R*x/100*2)/2):f(q(R*x/100,st)));
    const sep=isRange?"–":" / ";
    return vals.join(sep)+' kg'+(raw?'<span class="raw">'+pc+ancOf(b.lift)+'</span>':'');
  }
  // niente %: cella libera, precompilata con quello che c'era in scheda
  const v=state["ca_"+k]!==undefined?state["ca_"+k]:orig;
  return '<input class="free" type="text" data-k="ca_'+k+'" value="'+esc(v)+'" placeholder="scrivi il peso">';
}
function bind(){
  document.querySelectorAll("[data-k]").forEach(i=>{
    if(i.dataset.bound)return; i.dataset.bound=1;

      state[k]=e.target.value;save();

        if(el)el.innerHTML=topOut(k,parseFloat(e.target.dataset.pct)||null,parseFloat(e.target.dataset.st)||2.5);}});
  });
}

let sel=1, dsel="";
const chips=document.getElementById("chips");
[1,2,3,4,5].forEach(w=>{const b=document.createElement("button");b.textContent="S"+w;
  b.onclick=()=>{sel=w;draw()};chips.appendChild(b)});
const ab=document.createElement("button");ab.className="all";ab.textContent="TUTTE";
ab.onclick=()=>{sel=0;draw()};chips.appendChild(ab);
const dchips=document.getElementById("dchips");
DAYS.forEach(d=>{const b=document.createElement("button");b.textContent=d.id;
  b.onclick=()=>{dsel=(dsel===d.id?"":d.id);draw()};dchips.appendChild(b)});
const db=document.createElement("button");db.className="all";db.textContent="TUTTI";
db.onclick=()=>{dsel="";draw()};dchips.appendChild(db);
function draw(){
  [...chips.children].forEach((b,i)=>b.setAttribute("aria-pressed",(i+1===sel)||(i===5&&sel===0)?"true":"false"));
  [...dchips.children].forEach((b,i)=>b.setAttribute("aria-pressed",
    (i<DAYS.length&&DAYS[i].id===dsel)||(i===DAYS.length&&dsel==="")?"true":"false"));
  let h="", vis=0;
  DAYS.forEach(d=>{
    if(dsel && d.id!==dsel) return;
    vis++;
    const ne=d.blocks.length, ns=d.blocks.reduce((a,b)=>a+(sel?nserie(b.rows[sel-1]):0),0);
    h+='<div class="daybar">'+d.head+'<span>'+ne+' esercizi'+(sel?' · '+ns+' serie':'')+'</span></div>';
    d.blocks.forEach((b,bi)=>{
      h+='<div class="ex"><h3>'+b.nome+(b.ruolo?'<em>'+b.ruolo+'</em>':'')+'</h3>';
      b.rows.forEach((r,i)=>{
        if(sel && i+1!==sel) return;
        const k=d.id+bi+"_"+i;
        const pz=partsOf(r);
        const pill=r.rec?'<span class="rec"><em>Rec</em>'+r.rec+'</span>':'';
        h+='<div class="wk'+(sel?' solo':'')+'">'+(sel?'':'<div class="s">'+r.s+'</div>')+
          (pz? '<div class="multi">'+(r.rec?'<div class="recw">'+pill+'</div>':'')+
               pz.map((p,i)=>'<div class="parte">'+
               '<div class="sch">'+schema({se:p.se,rp:p.rp})+'</div>'+
               '<div class="car">'+caricoParte(p,b,k,i)+'</div></div>').join('<div class="poi">poi</div>')+
               '</div>'
             : '<div class="sch">'+schema(r)+pill+'</div>'+
               '<div class="car">'+carico(r,b,k)+'</div>')+
          (r.n?'<div class="nota">'+r.n+'</div>':'')+
          '<div class="app"><span>Come è andata</span><input type="text" data-k="ap_'+k+
            '" value="'+esc(state["ap_"+k]!==undefined?state["ap_"+k]:(r.ap||""))+
            '" placeholder="com’erano? quante ne avevi ancora"></div></div>';
      });
      h+='</div>';
    });
  });
  document.getElementById("out").innerHTML=h||'<p class="note">Nessun giorno selezionato.</p>';
  bind();
}
draw();
</script></body></html>
