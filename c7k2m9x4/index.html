<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#23232A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NC Coach">
<title>NC Performance · Clienti</title>
<style>
:root{--oro:#A9863B;--oro2:#C9A961;--nero:#23232A;--carta:#F1F1F2;--testo:#1c1c21;--grigio:#6b6b72}
*{box-sizing:border-box}
body{margin:0;background:var(--carta);color:var(--testo);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--nero);color:#fff;padding:18px 16px 14px;display:flex;align-items:baseline;gap:12px}
header .mono{font-family:Georgia,serif;color:var(--oro2);font-size:22px;letter-spacing:.08em}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{color:#bbb;font-size:13px;margin-left:auto}
main{padding:14px 16px 40px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid #e3e3e6;border-radius:14px;padding:14px 14px;margin:10px 0}
.cli{display:flex;align-items:center;gap:12px;cursor:pointer}
.cli .sig{font-family:Georgia,serif;color:var(--oro);font-size:20px;min-width:52px;text-align:center;background:#faf6ec;border-radius:10px;padding:8px 6px}
.cli .nome{font-weight:600;font-size:17px}
.cli .info{color:var(--grigio);font-size:13px;margin-top:2px}
.cli .fr{margin-left:auto;color:var(--oro);font-size:22px}
.cli.vecchio .info b{color:#b3402a}
button{font:inherit;background:var(--nero);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600}
button.sec{background:#fff;color:var(--nero);border:1px solid #cfcfd4}
input{font:inherit;width:100%;padding:12px;border:1px solid #cfcfd4;border-radius:10px;background:#fff}
label{display:block;font-size:13px;color:var(--grigio);margin:10px 0 4px}
.riga{display:flex;gap:10px;margin-top:10px}
.msg{color:var(--grigio);font-size:14px;padding:10px 2px}
.err{color:#b3402a}
footer{color:var(--grigio);font-size:12px;padding:10px 2px;text-align:center}
footer a{color:var(--grigio)}
.rin{font-size:13px;color:var(--grigio);margin-top:8px}
.rin input{padding:8px 10px;font-size:14px}
</style></head>
<body>
<header><div class="mono">NC</div><h1>Clienti</h1><div class="sub" id="ora"></div></header>
<main>
<div id="chiave" class="card" style="display:none">
  <b>Chiave di lettura</b>
  <div class="msg">Serve una volta sola: resta su questo telefono. È quella che hai tu e che non sta in nessuna scheda.</div>
  <label for="k">Chiave</label><input id="k" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ncl-…">
  <div class="riga"><button id="salvak">Salva ed entra</button></div>
</div>
<div id="lista"></div>
<div id="stato" class="msg"></div>
<div class="riga" id="azioni" style="display:none"><button class="sec" id="aggiorna">Aggiorna</button><button class="sec" id="cambiak">Cambia chiave</button></div>
</main>
<footer>Le schede che apri da qui sono una copia dell’archivio: quello che tocchi non va all’archivio.</footer>
<script>
const ARCH="https://script.google.com/macros/s/AKfycbxAHwzQlwAaeNLaKEy0EHuY-QOC7aiu-AnScNLi1J_kElFpdx4FNrEhDSbT3MSmlCSV/exec", MAP={"nicho": "k3m9x7q2", "sab": "ki48cgwe", "af": "b6t3w9k1", "collaudo": "p4q7z2m8"}, QUI=location.pathname;
function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function nomi(){try{return JSON.parse(g("nc-coach-nomi")||"{}")}catch(e){return {}}}
function quando(iso){const d=new Date(iso);if(isNaN(d))return "";const hh=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  const oggi=new Date();const gg=d.toDateString()===oggi.toDateString()?"oggi":("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2);return gg+" alle "+hh}
function vecchio(iso){const d=new Date(iso);return !isNaN(d)&&(Date.now()-d.getTime())>8*864e5}
const $=function(id){return document.getElementById(id)};
function mostraChiave(){$("chiave").style.display="";$("lista").innerHTML="";$("azioni").style.display="none";$("stato").textContent="";$("k").focus()}
$("salvak").onclick=function(){const v=$("k").value.trim();if(!v)return;s("nc-coach-k",v);$("chiave").style.display="none";carica()};
$("cambiak").onclick=function(){$("k").value="";mostraChiave()};
$("aggiorna").onclick=carica;
async function carica(){
  const k=g("nc-coach-k"); if(!k){mostraChiave();return}
  $("stato").textContent="Leggo l’archivio…"; $("stato").className="msg";
  let j=null;
  try{const r=await fetch(ARCH+"?k="+encodeURIComponent(k)+"&t="+Date.now(),{credentials:"omit",cache:"no-store"});j=await r.json()}catch(e){}
  if(!j){$("stato").textContent="Non riesco a leggere l’archivio: controlla la rete e riprova.";$("stato").className="msg err";$("azioni").style.display="";return}
  if(!j.ok){$("stato").textContent=j.err==="chiave"?"Chiave sbagliata.":"Errore: "+j.err;$("stato").className="msg err";s("nc-coach-k","");setTimeout(mostraChiave,900);return}
  const N=nomi(), L=$("lista"); L.innerHTML="";
  const sch=(j.schede||[]).slice().sort(function(a,b){return String(b.aggiornato).localeCompare(String(a.aggiornato))});
  if(!sch.length){$("stato").textContent="Nessuna scheda nell’archivio ancora.";$("azioni").style.display="";return}
  sch.forEach(function(x){
    const d=document.createElement("div"); d.className="card";
    const nome=N[x.persona]||x.persona;
    d.innerHTML='<div class="cli'+(vecchio(x.aggiornato)?" vecchio":"")+'"><div class="sig"></div><div><div class="nome"></div><div class="info"></div></div><div class="fr">›</div></div>'+
      '<div class="rin">Nome su questo telefono: <input type="text" placeholder="solo qui, non va in giro"></div>';
    d.querySelector(".sig").textContent=x.persona; d.querySelector(".nome").textContent=nome;
    d.querySelector(".info").innerHTML='<b>'+quando(x.aggiornato)+'</b> · '+(x.n||0)+' cose segnate · '+(x.programma||"");
    const inp=d.querySelector(".rin input"); inp.value=N[x.persona]||""; inp.onchange=function(){const M=nomi();if(inp.value.trim())M[x.persona]=inp.value.trim();else delete M[x.persona];s("nc-coach-nomi",JSON.stringify(M));d.querySelector(".nome").textContent=M[x.persona]||x.persona};
    d.querySelector(".cli").onclick=function(){apri(x,M_nome(x.persona))};
    L.appendChild(d);
  });
  $("stato").textContent=""; $("azioni").style.display="";
}
function M_nome(p){return nomi()[p]||p}
function apri(x,nome){
  const cart=MAP[x.persona]; if(!cart){$("stato").textContent="Per «"+x.persona+"» non c’è ancora una scheda collegata a questa pagina.";$("stato").className="msg err";return}
  const D=x.st||{}; const st=D.st||D, sto=D.sto||null;
  try{
    localStorage.setItem(x.ls,JSON.stringify(st));
    if(sto) localStorage.setItem("nc-storico-"+x.persona,JSON.stringify(sto)); else localStorage.removeItem("nc-storico-"+x.persona);
    localStorage.setItem("nc-coach",JSON.stringify({p:x.persona,t:x.aggiornato,da:QUI,nome:nome}));
  }catch(e){}
  location.href="../"+cart+"/?coach="+Date.now();
}
$("ora").textContent=new Date().toLocaleDateString("it-IT",{weekday:"short",day:"2-digit",month:"2-digit"});
carica();
if("serviceWorker" in navigator) window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body></html>
