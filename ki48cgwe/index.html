<title>Mesociclo 2 — ricomposizione</title><style>
:root{--paper:#F1F1F2;--card:#FFF;--alt:#E9E9EB;--band:#DBDBDE;--line:#CFCFD4;
--gold:#A9863B;--gold2:#C9A961;--ink:#23232A;--mute:#6E6E78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--paper:#17171A;--card:#1F1F23;--alt:#232328;--band:#2A2A31;--line:#35353D;
--gold:#C9A961;--gold2:#A9863B;--ink:#EDEDEF;--mute:#9A9AA4}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%;
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 60px}
header{padding:22px 0 14px;border-bottom:2px solid var(--gold)}
.mono{font:700 12px/1 Georgia,serif;letter-spacing:.34em;color:var(--gold)}
h1{font:400 23px/1.25 Georgia,serif;margin:9px 0 3px}
.sub{color:var(--mute);font-size:13.5px}
.rif{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:16px 0;padding:13px 15px}
.rif h2{font:700 11px/1 -apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px;color:var(--mute)}
.rif .r{display:flex;align-items:center;gap:9px;padding:6px 0}
.rif .r label{flex:1;font-size:14.5px}
.rif .r .tag{font-size:11.5px;color:var(--mute)}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);
border-radius:7px;padding:7px 9px}
input[type=number]{width:88px;text-align:right;font-variant-numeric:tabular-nums}
input:focus{outline:2px solid var(--gold2);outline-offset:1px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0}
.btns button{font:600 14px/1 -apple-system,sans-serif;padding:10px 15px;border-radius:8px;
border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
@media print{.btns,nav,.wkbar{display:none}body{background:#fff}}

.wkbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 14px 9px;margin:0 -14px;
border-bottom:1px solid var(--line)}
.wkbar .lab{display:block;font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.14em;
color:var(--mute);text-transform:uppercase;margin-bottom:7px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{font:700 13.5px/1 -apple-system,sans-serif;padding:10px 0;width:45px;border-radius:8px;
border:1px solid var(--line);background:var(--card);color:var(--mute);cursor:pointer}
.chips button.all{width:auto;padding:10px 9px;font-size:10.5px;letter-spacing:.06em}
.chips button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#fff}
.daybar{background:var(--gold);color:#fff;padding:11px 14px;margin:16px -14px 11px;
font:700 13px/1.25 -apple-system,sans-serif;letter-spacing:.2em;
display:flex;justify-content:space-between;align-items:center;gap:10px}
.daybar span{font:400 11px/1.3 -apple-system,sans-serif;letter-spacing:.04em;opacity:.9;
text-align:right;flex:0 0 auto}
.daybar:first-of-type{margin-top:10px}
.row2{margin-top:8px}
.daybar{background:var(--gold);color:#fff;padding:11px 14px;margin:16px -14px 11px;
font:700 13px/1.25 -apple-system,sans-serif;letter-spacing:.2em;
display:flex;justify-content:space-between;align-items:center;gap:10px}
.daybar span{font:400 11px/1.3 -apple-system,sans-serif;letter-spacing:.04em;opacity:.9;
text-align:right;flex:0 0 auto}
.daybar:first-of-type{margin-top:10px}
.wsep{font:700 10px/1 -apple-system,sans-serif;letter-spacing:.16em;color:var(--mute);
text-transform:uppercase;margin:16px 0 7px}

.ex{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
border-radius:8px;margin:0 0 12px;overflow:hidden}
.ex>h3{font:600 15.5px/1.3 Georgia,serif;margin:0;padding:11px 13px 10px;border-bottom:1px solid var(--line)}
.ex>h3 em{display:block;font:400 12px/1.3 -apple-system,sans-serif;font-style:normal;color:var(--gold);
font-weight:700;letter-spacing:.03em;margin-top:3px}
.ex .tbx{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;
background:#FBF7EF;border-bottom:1px solid var(--line)}
.ex .tbx+.tbx{border-top:0}
.ex .tbx .lb{font:700 10px/1.2 -apple-system,sans-serif;letter-spacing:.11em;
text-transform:uppercase;color:var(--gold)}
.ex .tbx input{width:96px;font:700 19px/1 -apple-system,sans-serif;padding:8px 10px;
text-align:right;font-variant-numeric:tabular-nums;border:1px solid var(--gold);background:var(--card)}
.ex .tbx .u{font:700 13px/1 -apple-system,sans-serif;color:var(--mute);margin-left:-3px}
.ex .tbx .hint{display:none;flex-basis:100%;font:400 11.5px/1.4 -apple-system,sans-serif;color:var(--mute)}
.ex .tbx input:placeholder-shown ~ .hint{display:block}
.ex .tbx .how{flex-basis:100%;margin-top:2px}
.ex .tbx .how summary{font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;
text-transform:uppercase;color:var(--gold);cursor:pointer;padding:4px 0;list-style:none}
.ex .tbx .how summary::-webkit-details-marker{display:none}
.ex .tbx .how summary::after{content:" ▾"}
.ex .tbx .how[open] summary::after{content:" ▴"}
.ex .tbx .how p{margin:4px 0 2px;font:400 12.5px/1.5 Georgia,serif;color:#4A4A55}

.wk{padding:11px 13px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk:nth-child(even){background:var(--alt)}
.wk .s{font:700 11px/1 -apple-system,sans-serif;letter-spacing:.12em;color:var(--mute);
text-transform:uppercase;margin-bottom:7px}
.wk .sch{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.wk .sch .n{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.wk .sch .n b{font:600 17px/1.15 -apple-system,sans-serif;font-variant-numeric:tabular-nums}
.wk .sch .n em{font:700 8.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.11em;
text-transform:uppercase;color:var(--mute);margin-top:3px}
.wk .sch .x{font:400 14px/1 -apple-system,sans-serif;color:var(--mute);padding-bottom:12px}
.wk .rec{margin-left:auto;display:inline-flex;align-items:baseline;gap:6px;max-width:62%;
text-align:right;line-height:1.35;background:var(--card);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:700 13.5px/1 -apple-system,sans-serif;color:var(--ink);
font-variant-numeric:tabular-nums}
.wk .rec em{font:700 8.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.11em;
text-transform:uppercase;color:var(--mute)}
.wk .recw{display:flex;justify-content:flex-end;margin-bottom:3px}
.wk .recw .rec{margin-left:0}
.wk .car{font:700 19px/1.2 -apple-system,sans-serif;color:var(--gold);margin-top:7px;
font-variant-numeric:tabular-nums}
.wk .car .raw{display:block;font:400 11.5px/1.35 -apple-system,sans-serif;color:var(--mute);margin-top:3px}
.wk .car .wait{font:600 14px/1.3 -apple-system,sans-serif;color:var(--mute)}
.wk .car input.free{width:100%;max-width:190px;font:400 14.5px/1.3 -apple-system,sans-serif;
padding:8px 10px;text-align:left}
.wk .parte{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0 10px}
.wk .parte:first-child{padding-top:2px}
.wk .parte .sch{flex:0 0 auto}
.wk .parte .car{margin-top:0;text-align:right;font-size:17px}
.wk .parte .car .raw{text-align:right}
.wk .poi{font:400 11px/1 -apple-system,sans-serif;color:var(--mute);letter-spacing:.1em;
text-transform:uppercase;border-top:1px dashed var(--line);padding-top:9px}
.wk .esec{font:400 12.5px/1.35 -apple-system,sans-serif;color:var(--ink);margin-top:7px;
background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 9px;display:inline-block}
.wk .nota{font:400 13.5px/1.45 Georgia,serif;color:#4A4A55;margin-top:8px}
.fp{margin-top:12px}
.fp .lb{display:block;font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;
color:var(--mute);text-transform:uppercase;margin-bottom:7px}
.sc{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.sc button{padding:11px 0;border-radius:6px;border:1px solid var(--line);background:var(--card);
font:700 13px/1 -apple-system,sans-serif;color:var(--mute);cursor:pointer;
font-variant-numeric:tabular-nums;-webkit-appearance:none;
transition:background .3s ease,border-color .3s ease,color .3s ease,box-shadow .2s ease}
.sc button.sel{box-shadow:0 0 0 2px var(--alt),0 0 0 3.5px var(--ink)}
.ends{display:flex;justify-content:space-between;margin-top:6px;
font:400 10px/1 -apple-system,sans-serif;color:var(--mute);letter-spacing:.04em}
.app{margin-top:10px}
.app span{display:block;font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;
color:var(--mute);text-transform:uppercase;margin-bottom:4px}
.app input{width:100%;font-size:14px;padding:8px 9px}
.manda{display:block;width:100%;margin:22px 0 4px;padding:15px 0;border-radius:10px;
border:0;background:var(--gold);color:#fff;cursor:pointer;
font:700 14px/1 -apple-system,sans-serif;letter-spacing:.06em}
.manda.vuoto{background:var(--line);color:#8A8A92}
.mandanota{font:400 11.5px/1.45 -apple-system,sans-serif;color:var(--mute);margin:8px 0 0;text-align:center}

/* onde, giri, ramping, MAX */
.wk .gl{display:flex;justify-content:space-between;align-items:center;gap:14px}
.wk .gl .car{margin-top:0;text-align:right;font-size:17px}
.wk .gl .car .raw{text-align:right}
.wk .gn{display:block;font:700 10px/1.2 -apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;
color:var(--gold);margin:0 0 4px}
.wk .giro,.wk .ramp{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:10px 12px 4px;margin-top:4px}
.wk .gt{font:700 11px/1.2 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.wk .gt b{font-size:15px;color:var(--gold)}
.wk .gt em{font:400 11px/1.2 -apple-system,sans-serif;font-style:normal;letter-spacing:0;text-transform:none;color:var(--mute);margin-left:6px}
.wk .gp{padding:7px 0 9px}
.wk .gp+.gp{border-top:1px dashed var(--line)}
.wk .parte .gn{margin-top:2px}
.wk .fatte{display:flex;align-items:center;gap:9px;padding:9px 0 8px;border-top:1px dashed var(--line);margin-top:4px}
.wk .fatte span{font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.wk input.mini{font:700 15px/1 -apple-system,sans-serif;padding:7px 8px;text-align:right;width:64px;
border:1px solid var(--gold);background:var(--card);border-radius:7px;font-variant-numeric:tabular-nums}
.wk .mx{display:inline-flex;flex-direction:column;align-items:center;margin-left:8px;line-height:1}
.wk .car .usato{margin-left:0;align-items:flex-start}
.wk .gl .car .usato{align-items:flex-end}
.wk .car .usato input::placeholder{color:var(--mute);font-weight:600}
/* kg serie per serie: una casella per ogni serie, sotto i colpi */
.wk .kgserie{display:block;margin-top:2px}
.wk .kgserie .ks-t{display:block;font:700 8.5px/1 -apple-system,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.wk .kgserie .ks-c{display:flex;flex-wrap:wrap;gap:6px}
.wk .kgserie label{display:flex;flex-direction:column;align-items:center;gap:3px}
.wk .kgserie input.mini{width:56px;padding:7px 4px;text-align:center}
.wk .kgserie input::placeholder{color:var(--mute);font-weight:600}
.wk .kgserie em{font:700 8.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:var(--mute)}
.wk .gl .car .kgserie .ks-c{justify-content:flex-end}
.wk .mx em{font:700 8.5px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.wk .at{font:700 17px/1.2 -apple-system,sans-serif;color:var(--gold)}
.wk .lieve{font:400 13px/1 -apple-system,sans-serif;color:var(--mute)}
.wk .libera{font:400 13px/1.3 -apple-system,sans-serif;color:var(--mute)}
.wk .car .raw{display:block}
.wk .freccia{font:400 15px/1 -apple-system,sans-serif;color:var(--mute)}
.wk .tst{font:700 13px/1 -apple-system,sans-serif;letter-spacing:.08em;color:var(--gold)}
/* EMOM */
.wk .emom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;
padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.wk .emom .ed{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.wk .emom .ed b{font:700 26px/1 -apple-system,sans-serif;color:var(--ink)}
.wk .emom .ed b small{font-size:14px;color:var(--mute);font-weight:600}
.wk .emom .ed em{font:700 9px/1.2 -apple-system,sans-serif;font-style:normal;letter-spacing:.11em;
text-transform:uppercase;color:var(--mute)}
.wk .emom .ed .es{font:700 20px/1 -apple-system,sans-serif;color:var(--gold);margin-left:4px}
.wk .emom .eb{flex:0 0 auto;border:0;border-radius:8px;background:var(--gold);color:#fff;
padding:11px 14px;font:700 12px/1 -apple-system,sans-serif;letter-spacing:.06em;cursor:pointer}
.wk .emom .eb.on{background:var(--ink)}
/* fascia del top dentro la riga del ramping */
.wk .parte>.gl{flex:1}
.wk .tbx.dentro{margin:-11px -13px 10px;border-radius:0}
.wk:first-of-type .tbx.dentro{margin-top:-11px}
/* EMOM: avviso volume e lampo a tutto schermo */
.wk .emom{flex-wrap:wrap}
.wk .emom .evol{flex-basis:100%;font:400 11px/1.4 -apple-system,sans-serif;color:var(--mute)}
#lampo{position:fixed;inset:0;background:#C9A961;opacity:0;pointer-events:none;z-index:99;transition:opacity .08s}
#lampo.on{opacity:.55}
/* settimane: una riga sola che scorre di lato, anche con 10-16 settimane */
#chips{flex-wrap:nowrap;overflow-x:auto;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto}
/* la settimana scorsa, peso del giorno, code contate dal top (2026-11-01) */
.wk .scorsa{margin:2px 0 10px;padding:8px 11px;border-left:3px solid var(--gold);background:var(--card);border-radius:0 8px 8px 0;
font:400 13px/1.45 -apple-system,sans-serif;color:var(--ink)}
.wk .scorsa .sl{display:block;font:700 9.5px/1.2 -apple-system,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.wk .oggi{font:700 17px/1.2 -apple-system,sans-serif;color:var(--ink)}
.wk .pdiv{display:block;margin-top:6px;font:400 11.5px/1.3 -apple-system,sans-serif;color:var(--mute)}
.wk .pdiv input.mini{width:58px;font-size:13px;padding:4px 6px;border-color:var(--line)}
/* contaserie */
.wk .cs{margin-top:12px}
.wk .cs .csh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.wk .cs .lb{font:700 9.5px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.wk .cs.fin .lb{color:var(--gold)}
.wk .csr{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line);border-radius:999px;
background:var(--card);padding:6px 11px 5px}
.wk .csr em{font:700 9px/1 -apple-system,sans-serif;font-style:normal;letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.wk .csr b{font:700 16px/1 -apple-system,sans-serif;color:var(--gold);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.wk .csr.vuoto b{color:var(--line)}
.wk .csr.fine{background:var(--gold);border-color:var(--gold);animation:pronto .9s ease-out 1}
.wk .csr.fine em,.wk .csr.fine b{color:#fff}
@keyframes pronto{0%{transform:scale(1)}30%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.wk .csr.fine{animation:none}}
/* metodo 1: pallini */
.wk .cs-pallini .dots{display:flex;gap:8px;flex-wrap:wrap}
.wk .cs-pallini .dots button{width:38px;min-height:38px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);
color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;cursor:pointer}
.wk .cs-pallini .dots button b{font:700 13px/1 -apple-system,sans-serif}
.wk .cs-pallini .dots button em{font:600 9.5px/1 -apple-system,sans-serif;font-style:normal;opacity:.8}
.wk .cs-pallini .dots button.next{border-color:var(--gold);color:var(--gold)}
.wk .cs-pallini .dots button.on{background:var(--gold);border-color:var(--gold);color:#fff}
/* metodo 2: tasto unico */
.wk .cs-tasto .big{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
border:1.5px solid var(--gold);border-radius:10px;background:var(--card);cursor:pointer}
.wk .cs-tasto .big .t{font:700 12px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.wk .cs-tasto .big .c{font:600 15px/1 -apple-system,sans-serif;color:var(--mute);font-variant-numeric:tabular-nums}
.wk .cs-tasto .big .c b{font-size:24px;color:var(--ink)}
.wk .cs-tasto .big:active{transform:scale(.985)}
.wk .cs-tasto .big.batti{animation:batti .6s ease-out}
.wk .cs-tasto .big.batti .c b{display:inline-block;animation:salta .45s ease-out}
@keyframes batti{0%{background:var(--gold)}100%{background:var(--card)}}
@keyframes salta{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.wk .cs-tasto.fin .big.batti{animation:none}
@media (prefers-reduced-motion:reduce){.wk .cs-tasto .big.batti,.wk .cs-tasto .big.batti .c b{animation:none}}
.wk .cs-tasto.fin .big{background:var(--gold);cursor:default}
.wk .cs-tasto.fin .big .t,.wk .cs-tasto.fin .big .c,.wk .cs-tasto.fin .big .c b{color:#fff}
.wk .cs-tasto .csb{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.wk .cs-tasto .und{border:0;background:none;font:400 12px/1 -apple-system,sans-serif;color:var(--mute);text-decoration:underline;
text-underline-offset:3px;cursor:pointer;padding:6px 0}
/* metodo 3: righe */
.wk .cs-righe .sr{width:100%;display:flex;align-items:center;gap:12px;padding:10px 2px;border:0;border-top:1px dashed var(--line);
background:none;cursor:pointer;text-align:left}
.wk .cs-righe .sr:last-child{border-bottom:1px dashed var(--line)}
.wk .cs-righe .o{font:700 11px/1 -apple-system,sans-serif;color:var(--mute);width:24px}
.wk .cs-righe .rp{font:700 15px/1 -apple-system,sans-serif;color:var(--ink);flex:1}
.wk .cs-righe .rt{display:flex;justify-content:flex-end}
.wk .cs-righe .rt .csr{padding:4px 9px 3px}.wk .cs-righe .rt .csr b{font-size:14px}
.wk .cs-righe .ck{width:24px;height:24px;border-radius:999px;border:1.5px solid var(--line);flex:0 0 auto;position:relative}

             ca:(mn?(i===0?"__NUOVO__":mn[1]):(mt?(i===0?"__TEST__":mt[1]):(cav[i]!==undefined?cav[i]:cav[0])))};

  }
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*kg\s+per manubrio$/i))) return f(parseFloat(m[1].replace(",",".")))+' kg <span class="lieve">per manubrio</span>';
  if(/^senza peso$/i.test(t)) return '<span class="lieve">senza peso</span>';
  /* peso del test, 5RM -15%, -20% da solo */
  if(/peso del test/i.test(t)) return daTest(t,T);
  if(/^\d+\s*RM\s*[−\-]\s*\d+\s*%/i.test(t)) return daTest(t,T);
  if(/^[−\-]\s*\d+\s*%$/.test(t)) return daTest(t,T);
  /* peso di lavoro: lo scrive lui accanto ai colpi; se c'e' uno sconto, il risultato esce di fianco */
  if(/peso di lavoro/i.test(t)){
    const ha=/[\u2212\-]\s*\d+\s*%/.test(t), base=pesoLavoro(bk,k,i);
    let h=campo("W_"+k+"_"+i,"kg",78);
    if(ha) h+=' <span class="freccia">\u2192</span> <b>'+((isFinite(base)&&base>0)?kg(base*sconto(t)):'\u2014')+'</b>';
    return h+'<span class="raw">'+t+'</span>';
  }
  /* % del test, anche a range */
  if((m=t.match(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*%\s*del test/i))){
    if(!isFinite(T)||T<=0) return '<span class="wait">dopo il test</span><span class="raw">'+t+'</span>';
    const a=parseFloat(m[1].replace(",",".")), bb=m[2]?parseFloat(m[2].replace(",",".")):null;
    return (bb?(f(Math.round(T*a/100*10)/10)+'–'+kg(T*bb/100)):kg(T*a/100))+'<span class="raw">'+t+'</span>';
  }
  /* % del top: il top lo scrive lui */
  if((m=t.match(/(\d+(?:[.,]\d+)?)\s*%\s*del\s*(top|mav)/i))){
    const tk="RK_"+k+"_0", tv=num(state[tk]), pct=parseFloat(m[1].replace(",","."));
    const out=(isFinite(tv)&&tv>0)?kg(tv*pct/100):'<span class="wait">dopo il top</span>';
    return '<span class="topout" data-k="'+tk+'" data-pct="'+pct+'">'+out+'</span><span class="raw">'+t+'</span>';
  }
  /* stesso peso del top */
  if(/^peso del top$/i.test(t)){
    const tk="RK_"+k+"_0", tv=num(state[tk]);
    return '<span class="topout" data-k="'+tk+'" data-pct="100">'+((isFinite(tv)&&tv>0)?kg(tv):'<span class="wait">dopo il top</span>')+'</span><span class="raw">stesso peso del top</span>';
  }
  /* MAV: massima alzata veloce, il peso lo scrive lui */
  if(/^MAV$/i.test(t)) return '<span class="at">MAV</span> '+campo("RK_"+k+"_"+i,"kg",72)+'<span class="raw">massima alzata veloce</span>';
  /* % del massimale (programmi in % del 1RM) */
  if((m=t.match(/^(\d+(?:[.,]\d+)?)(?:\s*[-\u2013]\s*(\d+(?:[.,]\d+)?))?\s*%$/))&&b&&b.lift&&MASS.length){
    const M=massimale(b.lift), raw='<span class="raw">'+t+' del massimale</span>';
    if(!isFinite(M)||M<=0) return '<span class="wait">dopo il massimale</span>'+raw;
    const a=parseFloat(m[1].replace(",",".")), bb=m[2]?parseFloat(m[2].replace(",",".")):null;
    return (bb?f(M*a/100)+'\u2013'+kgx(M*bb/100):kgx(M*a/100))+raw;
  }
  /* RPE: scrive lui il peso che ha trovato */
  if(/^RPE\s*\d/i.test(t)||/^@\s*\d/.test(t)){
    const kk="RK_"+k+"_"+i;
    return '<span class="at">'+t.replace(/^RPE\s*/i,"@")+'</span> '+campo(kk,"kg",72)+'<span class="raw">peso trovato a '+t+'</span>';
  }
  /* un numero secco: sono kg */
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*(kg)?$/i))) return f(parseFloat(m[1].replace(",",".")))+' kg';
  /* testo libero: carico non prescritto, la casella per i kg usati davvero */
  return usato(bk,k,i,t);
}

/* ---------- regola del peso (top set + code) ---------- */
function rigaDi(k){return parseInt(String(k).slice(String(k).lastIndexOf("_")+1))||0}
function topDi(bk,ri){return num(state["MX_"+bk+"_"+ri+"_0"])}
function suggerito(bk,b,ri){
  const R=b.regola; if(ri<=0) return R.start;
  const prev=pesoGiorno(bk,b,ri-1);
  if(b.rows[ri]&&b.rows[ri].inc===0) return prev;
  const tp=topDi(bk,ri-1);
  return (isFinite(tp)&&tp>R.soglia)?prev+R.passo:prev;
}
function pesoGiorno(bk,b,ri){
  const v=num(state["P_"+bk+"_"+ri]); if(isFinite(v)&&v>0) return v;
  return suggerito(bk,b,ri);
}

/* ---------- carico non prescritto: kg usati, con il peso della settimana prima come suggerimento ---------- */
function precUsato(bk,k,i){
  const ri=parseInt(k.slice(k.lastIndexOf("_")+1))||0, b=bloccoDi(bk);
  for(let r=ri-1;r>=0;r--){const v=state["U_"+bk+"_"+r+"_"+i];
    if(v!==undefined&&String(v).trim()!=="") return {v:String(v).trim(),s:b?b.rows[r].s:""};}
  return null;
}
function bloccoDi(bk){const p=bk.split("_"),g=GIORNI.find(function(x){return x.id===p[0]});return g?g.blocks[+p[1]]:null}
let RIGA_SENZA_SERIE=false;
function usato(bk,k,i,t){
  if(!k||RIGA_SENZA_SERIE) return t?'<span class="wait">'+t+'</span>':'';
  const ms=serieMulti(k,i,t); if(ms) return usatoSerie(bk,k,i,t,ms);
  const pr=precUsato(bk,k,i), zav=/zavorr|corpo libero/i.test(t||"");
  const piu=/salire|ogni serie/i.test(t||"");
  const kk="U_"+k+"_"+i, v=state[kk]||"";
  return '<span class="mx usato"><input type="text"'+(piu?'':' inputmode="decimal"')+' class="mini" data-k="'+kk+
    '" value="'+esc(v)+'" placeholder="'+(pr?esc(pr.s+": "+pr.v):(piu?"60-70-80":"kg"))+'" style="width:'+(piu?104:84)+'px">'+
    '<em>'+(zav?'kg di zavorra':'kg usati')+'</em></span>'+(t?'<span class="raw">'+t+'</span>':'');
}
/* pesi diversi serie per serie (12-10-8 «a salire», 60-70-80): una casella per ogni serie, sotto i suoi colpi.
   Le caselle sono U_<riga>_<pezzo>_s0, _s1…; U_<riga>_<pezzo> resta il riassunto «60-70-80» (2026-11-03) */
function serieMulti(k,i,t){
  let x; try{x=rigaObj(k)}catch(e){return null}
  const ts=tipoSerie(x.r.se); if(ts.t!=="num") return null;
  const p=parti(x.r)[i]; if(!p) return null;
  const n=parseInt(p.se)||0; if(n<2||n>8) return null;
  const rr=String(p.rp||"").split("-").map(function(z){return z.trim()});
  const diversi=rr.length===n&&rr.some(function(z){return z!==rr[0]});
  const lista=numeri(t).length===n&&/^[\d\s.,\-\u2013]+\s*(kg)?$/i.test(String(t||"").trim());
  if(!(diversi||lista||/salire|ogni serie/i.test(t||""))) return null;
  return {n:n,rp:rr.length===n?rr:null};
}
function usatoSerie(bk,k,i,t,ms){
  const base="U_"+k+"_"+i, unito=numeri(state[base]);
  const zav=/zavorr|corpo libero/i.test(t||"");
  let h='<span class="kgserie"><span class="ks-t">'+(zav?'kg di zavorra':'kg usati')+', serie per serie</span><span class="ks-c">';
  for(let j=0;j<ms.n;j++){
    const kk=base+"_s"+j;
    let v=state[kk]; if(v===undefined&&unito.length===ms.n) v=f(unito[j]);  /* dati scritti prima tutti in una casella */
    const pr=precSerie(bk,k,i,j,ms.n);
    h+='<label><input type="text" inputmode="decimal" class="mini" data-k="'+kk+'" value="'+esc(v||"")+
       '" placeholder="'+(pr?esc(pr):"kg")+'"><em>'+(ms.rp?ms.rp[j]+(ms.rp[j]==="1"?" colpo":" colpi"):(j+1)+"\u00aa serie")+'</em></label>';
  }
  return h+'</span></span>'+(t?'<span class="raw">'+t+'</span>':'');
}
function precSerie(bk,k,i,j,n){
  /* il peso della stessa serie nell'ultima settimana in cui c'e' */
  const ri=rigaDi(k);
  for(let r=ri-1;r>=0;r--){const b0="U_"+bk+"_"+r+"_"+i, v=state[b0+"_s"+j];
    if(v!==undefined&&String(v).trim()!=="") return String(v).trim();
    const a=numeri(state[b0]); if(a.length===n) return f(a[j]); if(a.length===1) return f(a[0]);}
  return null;
}
function unisciSerie(kk){
  /* una casella di una serie cambiata: si rifa' il riassunto «60-70-80» (? dove manca) */
  const m=kk.match(/^(U_[A-Z]_\d+_\d+_\d+)_s\d+$/); if(!m) return;
  let ult=-1; for(let j=0;j<12;j++) if(String(state[m[1]+"_s"+j]||"").trim()) ult=j;
  const vals=[]; for(let j=0;j<=ult;j++) vals.push(String(state[m[1]+"_s"+j]||"").trim()||"?");
  if(vals.length) state[m[1]]=vals.join("-"); else delete state[m[1]];
}

/* ---------- schemi ---------- */
function etich(rp){rp=String(rp||"").trim().toUpperCase();
  if(!rp||rp==="—") return "";
  if(/^\d+\s*S$/.test(rp)||/^\d+\s*"$/.test(rp)) return "tenuta";
  if(/^\d+\s*'$/.test(rp)||/^\d+\s*MIN/.test(rp)) return "minuti";
  if(rp==="MAX"||rp==="AMRAP") return "";
  return rp==="1"?"colpo":"colpi"}
function isMax(rp){rp=String(rp||"").trim().toUpperCase();return /^(MAX|AMRAP)(\s*(S|"|''|SEC|TEMPO))?$/.test(rp)}
function isMaxTempo(rp){rp=String(rp||"").trim().toUpperCase();return /^(MAX|AMRAP)\s*(S|"|''|SEC|TEMPO)$/.test(rp)}
function isMezzoMax(rp){rp=String(rp||"").trim().toUpperCase();return /^MAX\s*(\/\s*2|\u00bd)$/.test(rp)||/^MET[AÀ]\s*(DEL)?\s*MAX$/.test(rp)}
function ultimoMax(bk){
  /* l'ultimo MAX segnato in questo esercizio, in qualunque settimana */
  let best=null;
  Object.keys(state).forEach(function(k){
    if(k.indexOf("MX_"+bk+"_")!==0) return;
    const v=String(state[k]||"").match(/\d+(?:[.,]\d+)?/); if(!v) return;
    const n=parseFloat(v[0].replace(",",".")); if(isFinite(n)) best=(best===null?n:Math.max(best,n));
  });
  return best;
}
function relSrc(k,bk){
  /* le code si contano dal top di questa riga; se la riga non ha top, dal top della settimana prima */
  const ri=rigaDi(k), b=bk?bloccoDi(bk):null;
  if(b&&b.rows[ri]&&/MAX/i.test(String(b.rows[ri].rp||""))) return "MX_"+k+"_0";
  return ri>0?"MX_"+bk+"_"+(ri-1)+"_0":"";
}
function relTxt(src,d){const t=num(state[src]);
  return (isFinite(t)&&t>0)?'<b>'+Math.max(1,t-d)+'</b><em>colpi</em>':'<b>\u2212'+d+'</b><em>colpi dal top</em>';}
function colpiHTML(p,k,i,bk){
  const mr=String(p.rp||"").trim().match(/^[\u2212\-](\d+)$/);
  if(mr){const src=relSrc(k,bk);return '<span class="n rel" data-src="'+src+'" data-d="'+mr[1]+'">'+relTxt(src,parseInt(mr[1]))+'</span>';}
  if(isMaxTempo(p.rp)) return '<span class="n"><b>MAX</b><em>secondi</em></span>'+
    '<span class="mx">'+campo("MX_"+k+"_"+i,"45, 40, 38",92)+'<em>secondi fatti</em></span>';
  if(isMax(p.rp)) return '<span class="n"><b>MAX</b><em>colpi</em></span>'+
    '<span class="mx">'+campo("MX_"+k+"_"+i,"11, 10, 9",92)+'<em>colpi fatti</em></span>';
  if(isMezzoMax(p.rp)){const u=bk?ultimoMax(bk):null;
    return '<span class="n"><b>'+(u!==null?f(Math.round(u/2)):'\u00bd')+'</b><em>'+(u!==null?'met\u00e0 del MAX':'met\u00e0 del tuo MAX')+'</em></span>';}
  let l=etich(p.rp); const bb=bk?bloccoDi(bk):null;
  if(l==="colpi"&&bb&&bb.colpilab) l=bb.colpilab;
  return l?'<span class="n"><b>'+p.rp+'</b><em>'+l+'</em></span>':'';
}
function schema(p,k,i,bk){
  const col=colpiHTML(p,k,i,bk);
  return '<span class="n"><b>'+p.se+'</b><em>serie</em></span>'+(col?'<span class="x">×</span>'+col:'');
}

/* ---------- fatica percepita ---------- */
const FPC=[[40,16,99],[40,20,96],[39,24,92],[39,28,87],[38,33,80],[37,38,72],[36,44,62],[35,50,52],[34,54,42],[33,58,33]];
function fcol(n){const c=FPC[n-1];return "hsl("+c[0]+" "+c[1]+"% "+c[2]+"%)"}
function fbord(n){const c=FPC[n-1];return "hsl("+c[0]+" "+Math.min(c[1]+10,70)+"% "+Math.max(c[2]-9,14)+"%)"}
function fink(n){return FPC[n-1][2]<58?"#fff":"#23232A"}
let FPT={};
function paintFp(box,v,anim){
  const kids=box.children, key=box.dataset.k||"";
  if(FPT[key]) FPT[key].forEach(clearTimeout); FPT[key]=[];
  function set(i){const b=kids[i],n=i+1;b.style.background=fcol(n);b.style.borderColor=fbord(n);b.style.color=fink(n);b.className=(n===v)?"on sel":"on"}
  function clr(i){const b=kids[i];b.style.background="";b.style.borderColor="";b.style.color="";b.className=""}
  for(let i=v;i<10;i++) clr(i);
  for(let i=0;i<v;i++){ if(anim) FPT[key].push(setTimeout(function(){set(i)},i*55)); else set(i); }
}
let FPR=null;
function setFp(k,n,el){const key="fp_"+k;state[key]=(String(state[key])===String(n))?"":n;save();
  paintFp(el.parentNode,parseInt(state[key])||0,true);segnaManda();clearTimeout(FPR);FPR=setTimeout(ricostruisci,1500);}
function feedback(k,r){
  let sc='';for(let n=1;n<=10;n++) sc+='<button type="button" data-fp="'+k+'" data-n="'+n+'">'+n+'</button>';
  return '<div class="fp"><span class="lb">Fatica percepita</span><div class="sc" data-k="'+k+'">'+sc+'</div>'+
    '<div class="ends"><span>leggera</span><span>massima</span></div></div>'+
    '<div class="app"><span>Note</span><input type="text" data-k="ap_'+k+'" value="'+
    esc(state["ap_"+k]!==undefined?state["ap_"+k]:(r.ap||""))+'"></div>';
}

/* ---------- riferimenti dentro l'esercizio ---------- */
function howTo(rm){
  const n=(String(rm).match(/[\d–\-]+/)||[""])[0].replace("–","-");
  const uno=n.indexOf("-")<0, art=(n==="8"||n==="11"||n==="18")?"gli":"i";
  return '<b>Devi trovare il massimo peso con cui riesci a fare '+n+' colpi.</b> Parti da un peso leggero e fai '+n+
   ' colpi. Aumenta il peso un po’ alla volta, sempre serie da '+n+', fino a quando arrivi al peso che riesci ancora '+
   'a completare pulito. Se sali e '+(uno?art:"i")+' '+n+' colpi non li chiudi, il tuo '+rm+' è il peso di prima. Di norma ci arrivi in 3-5 serie.';
}
function riferimenti(b,bk,sett){
  let h=''; const rm=testDi(b), tw=settDelTest(b);
  if(rm){

        '<details class="how"'+(v?'':' open')+'><summary>'+(b.howlab||('Come si trova il '+rm))+'</summary><p>'+(b.how||howTo(rm))+'</p></details></div>';
    }

  return h;
}

/* ---------- il top del ramping: stessa fascia del test RM ---------- */
function rpeDi(t){const m=String(t||"").match(/(?:RPE|@)\s*(\d+(?:[.,]5)?)/i);return m?parseFloat(m[1].replace(",",".")):null}
function fasciaTop(p,k,r){

/* ---------- la settimana scorsa: quello che si è segnato sullo stesso esercizio ---------- */
function scorsaHTML(b,bk,ri,sett){
  if(!sett) return "";
  if(b.regola){
    const R=b.regola, row=b.rows[ri], haTop=/MAX/i.test(String(row.rp||""));
    if(ri===0) return '<div class="scorsa"><span class="sl">Si parte</span>Peso: <b>'+kg(R.start)+'</b>. Segna sempre i colpi del top: '+
      'quando superi i '+R.soglia+', la settimana dopo il peso sale di '+f(R.passo)+' kg da solo.</div>';
    const pr=b.rows[ri-1], tp=topDi(bk,ri-1), pp=pesoGiorno(bk,b,ri-1), P=pesoGiorno(bk,b,ri);
    const ps=String(pr.s);
    if(!/MAX/i.test(String(pr.rp||""))) return '<div class="scorsa"><span class="sl">Settimana scorsa · '+ps+'</span>'+kg(pp)+', senza top set.</div>';
    if(!isFinite(tp)||tp<=0) return '<div class="scorsa"><span class="sl">Settimana scorsa · '+ps+'</span>'+kg(pp)+
      ' \u2014 colpi del top <b>non segnati</b>. Segnali sempre: servono a capire quando salire.</div>';
    let h='<div class="scorsa"><span class="sl">Settimana scorsa · '+ps+'</span><b>'+kg(pp)+' \u00d7 '+tp+' colpi</b> nel top.';
    if(!haTop) h+=' Oggi niente top: le serie si contano da quei '+tp+' colpi.';
    else if(row.inc===0) h+=' Oggi stesso peso: confronta i colpi.';
    else if(P>pp) h+=' Hai superato i '+R.soglia+': <b>oggi '+kg(P)+'</b>. Con il peso nuovo i colpi ripartono più bassi, va bene così.';
    else h+=' Oggi stesso peso: <b>confermi i '+tp+' o ne fai '+(tp+1)+'</b>.';
    return h+'</div>';
  }
  if(ri<=0) return "";
  const k0=bk+"_"+(ri-1), pz=[];
  const nomi=nomiBlocco(b);
  for(let i=0;i<6;i++){
    const chi=nomi&&nomi[i]?nomi[i].toLowerCase()+": ":"";
    const mx=state["MX_"+k0+"_"+i], u=state["U_"+k0+"_"+i], rk=state["RK_"+k0+"_"+i], w=state["W_"+k0+"_"+i];
    if(mx&&String(mx).trim()) pz.push(chi+(isMaxTempo(String((parti(b.rows[ri-1])[i]||{}).rp||""))?String(mx).trim()+" secondi":"MAX "+String(mx).trim()+" colpi"));
    if(u&&String(u).trim()) pz.push(chi+String(u).trim()+(/^\d+(?:[.,]\d+)?$/.test(String(u).trim())?" kg":""));
    if(rk&&String(rk).trim()) pz.push(chi+String(rk).trim()+" kg");
    if(w&&String(w).trim()) pz.push(chi+String(w).trim()+" kg");
  }
  const nt=state["NT_"+k0]; if(nt&&String(nt).trim()) pz.push("nuovo test "+String(nt).trim());
  const fp=state["fp_"+k0]; if(fp) pz.push("fatica "+fp+"/10");
  const ap=state["ap_"+k0]; if(ap&&String(ap).trim()) pz.push("\u00ab"+String(ap).trim()+"\u00bb");
  if(!pz.length) return "";
  return '<div class="scorsa"><span class="sl">Settimana scorsa · '+String(b.rows[ri-1].s)+'</span>'+pz.join(" \u00b7 ")+'</div>';
}

/* il recupero scritto come il contatore: 90" -> 1:30, 2'-3' -> 2:00–3:00, cosi' lo riconosci quando arriva (2026-11-03) */
function recVedi(t){
  t=String(t||"");
  if(/EMOM|il minuto/i.test(t)) return t;
  return t.replace(/(\d+)\s*(''|"|\u2033)|(\d+)\s*('|\u2032|\u2019)(?:\s*(\d+)\s*(''|"|\u2033))?/g,function(a,s1,u1,m2,u2,s2){
    return mmss(s1!==undefined?+s1:(+m2*60+(s2?+s2:0)));
  }).replace(/(\d)\s*-\s*(\d)/g,"$1\u2013$2");

function serieDi(r){

    for(let x=0;x<ts.extra;x++) out.push({rp:pz[pz.length-1].rp,lab:"serie"});
    return out;
  }
  if(ts.t==="ramp"&&ts.extra){const p=pz[1]||pz[0];for(let x=0;x<ts.extra;x++)out.push({rp:p.rp,lab:"serie"});return out}

function recSec(t){

/* ---------- record: il meglio di sempre, anche dei programmi passati (v2, 2026-11-03) ----------

   Il test, il top @RPE, la MAV e i secondi sono record a se'. Le voci della stessa settimana non si
   confrontano tra loro: la settimana 1 di un cliente nuovo non festeggia mai. Uguale = solo il clin. */
const PERSONA=(typeof PERSONA0!=="undefined"&&PERSONA0)||LS;

const PROGN=(typeof PROGN0!=="undefined"&&PROGN0)||1;

function numeri(v){return (String(v==null?"":v).match(/\d+(?:[.,]\d+)?/g)||[]).map(function(x){return parseFloat(x.replace(",","."))})}
function massimo(v){const a=numeri(v);return a.length?Math.max.apply(null,a):NaN}
const EPS=0.01;

/* quanto e' dura: [fermi, secondi di negativa, secondi di positiva].
   Negativa = la fase in cui il peso torna giu' (squat, panca, rumeno: la discesa; lat machine: la barra che risale;
   rowing: le braccia che tornano avanti). Positiva = quella in cui lo sollevi. Valgono per ogni esercizio (2026-11-03) */
const PAROLE={un:1,uno:1,una:1,due:2,tre:3,quattro:4,cinque:5};
function durDa(t,nota){
  /* nota=true: testo libero del coach, il fermo conta solo se e' scritto come prescrizione (non "ti fermi") */
  t=String(t||"").toLowerCase(); let fe=0,di=0,sa=0,m;
  if(/^\s*(gara|da gara|normale|liscio|no var)\s*$/.test(t)) return [0,0,0];
  if((m=t.match(/(\d+)\s*["″]\s*\/\s*(\d+)\s*["″]/))){di=+m[1];sa=+m[2]}
  if((m=t.match(/\b(\d+|uno|una|due|tre|quattro|cinque)\s+fermi\b/))) fe=PAROLE[m[1]]||parseInt(m[1])||1;
  else if(nota?/\bfermo\s+(pieno\s+)?\d+\s*["\u2033]|\bfermo\s+(sotto|gi[u\u00f9]|in buca|al petto|sopra|all.incastro)|\bcon\s+(il\s+)?fermo\b/.test(t)
               :/\bfermo\b|\bpausa\b/.test(t)) fe=1;
  if((m=t.match(/(?:discesa|negativa)[^.;:]*?(\d+)\s*(?:["″]|sec\b|secondi|s\b)/))) di=Math.max(di,+m[1]);
  else if(/discesa lenta|negativa lenta|\bnegativa\b|scendi contando/.test(t)) di=Math.max(di,3);
  if((m=t.match(/(?:salita|positiva)[^.;:]*?(\d+)\s*(?:["″]|sec\b|secondi|s\b)/))) sa=Math.max(sa,+m[1]);
  return [fe,di,sa];
}
function durDi(b,r,i){
  if(r&&r.durp&&r.durp[i]!==undefined&&r.durp[i]!==null) return durDa(r.durp[i]);
  if(r&&r.dur!==undefined) return durDa(r.dur);
  let d=b.dur!==undefined?durDa(b.dur):durDa(String(b.nome||"")+" "+String(b.ruolo||""));
  const nota=(String(r&&r.n||"")+" "+String(r&&r.es||"")).toLowerCase();
  if(b.dur===undefined){const x=durDa(nota,true);d=[Math.max(d[0],x[0]),Math.max(d[1],x[1]),Math.max(d[2],x[2])]}
  if(/senza tempo|squat liscio|\bliscio\b|no var\b|da gara|senza variante/.test(nota)) return [0,0,0];
  if(/senza (la )?(discesa|negativa)|niente (discesa|negativa)/.test(nota)) d[1]=0;
  if(/senza ferm|niente ferm/.test(nota)) d[0]=0;
  return d;
}
function durMag(a,b){return a[0]>=b[0]&&a[1]>=b[1]&&a[2]>=b[2]}               /* a e' dura almeno quanto b */
function durPiu(a,b){return durMag(a,b)&&(a[0]>b[0]||a[1]>b[1]||a[2]>b[2])}

/* chi e' l'esercizio: lo stesso nome anche in un programma nuovo. Fermi e tempi non cambiano l'esercizio:

function norm(s){return String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim()}

}

/* i kg di un pezzo (numero, lista per serie, NaN se non si sa) */
function kgNum(p,bk,b,k,i){
  if(state["U_"+k+"_"+i+"_s0"]!==undefined){                       /* una casella per serie */
    let ult=-1;for(let j=0;j<12;j++)if(state["U_"+k+"_"+i+"_s"+j]!==undefined)ult=j;
    const out=[];for(let j=0;j<=ult;j++)out.push(num(state["U_"+k+"_"+i+"_s"+j]));
    if(out.some(function(x){return isFinite(x)})) return out;
  }
  const u=state["U_"+k+"_"+i];
  if(u!==undefined&&String(u).trim()!==""){const a=numeri(u);return a.length?(a.length===1?a[0]:a):NaN}
  const t=String(p.ca||"").trim(), T=rifT(bk); let m;
  const pc=function(x){return parseFloat(x.replace(",","."))/100};
  if(/^(corpo libero|senza peso)$/i.test(t)) return 0;
  if(t==="__TEST__") return T>0?T:NaN;
  if(t==="__NUOVO__"){const v=num(state["NT_"+k]);return v>0?v:NaN}
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*%\s*del nuovo$/i))||/^peso del nuovo$/i.test(t)){const v=num(state["NT_"+k]);return v>0?v*(m?pc(m[1]):1):NaN}
  if(b.regola&&/^(peso del giorno|stesso peso)$/i.test(t)) return pesoGiorno(bk,b,rigaDi(k));
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*kg\s+per manubrio$/i))) return parseFloat(m[1].replace(",","."));
  if(/peso del test/i.test(t)||/^\d+\s*RM\s*[−\-]\s*\d+\s*%/i.test(t)||/^[−\-]\s*\d+\s*%$/.test(t)) return T>0?T*sconto(t):NaN;
  if(/peso di lavoro/i.test(t)){const base=pesoLavoro(bk,k,i);return base>0?base*sconto(t):NaN}
  if((m=t.match(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*%\s*del test/i))) return T>0?T*pc(m[1]):NaN;
  if((m=t.match(/(\d+(?:[.,]\d+)?)\s*%\s*del\s*(top|mav)/i))){const tv=num(state["RK_"+k+"_0"]);return tv>0?tv*pc(m[1]):NaN}
  if(/^peso del top$/i.test(t)){const tv=num(state["RK_"+k+"_0"]);return tv>0?tv:NaN}
  if(/^MAV$/i.test(t)||/^RPE\s*\d/i.test(t)||/^@\s*\d/.test(t)){const v=num(state["RK_"+k+"_"+i]);return v>0?v:NaN}
  if((m=t.match(/^(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*%$/))&&b.lift&&MASS.length){const M=massimale(b.lift);return M>0?M*pc(m[1]):NaN}
  if(/^[\d\s.,\-–]+\s*(kg)?$/i.test(t)){const a=numeri(t);return a.length?(a.length===1?a[0]:a):NaN}
  return NaN;
}
function secDa(rp){const m=String(rp||"").trim().match(/^(\d+)\s*(s|"|″|''|sec|secondi)$/i);return m?+m[1]:NaN}
function secNum(p,bk,k){
  const t=String(p.ca||"").trim(), T=rifT(bk); let m;
  if(t==="__TEST__") return T>0?T:NaN;
  if(t==="__NUOVO__"){const v=num(state["NT_"+k]);return v>0?v:NaN}
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*%\s*del tempo del test$/i))||/^tempo del test$/i.test(t)){
    const q=m?parseFloat(m[1].replace(",","."))/100:1;return T>0?Math.max(30,Math.round(T*q+1e-9)):NaN}
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*%\s*del nuovo$/i))||/^tempo del nuovo$/i.test(t)){
    const v=num(state["NT_"+k]),q=m?parseFloat(m[1].replace(",","."))/100:1;return v>0?Math.max(30,Math.round(v*q+1e-9)):NaN}
  const s=secDa(p.rp); return s>0?s:NaN;
}

/* le voci di questo programma, ricostruite da quello che e' scritto */
function voce(o){o.pg=PROG;o.pgn=PROGN;o.ls=LS;
  o.id=LS+"|"+o.k+"|"+o.i+"|"+o.ty+"|"+o.r+"|"+(Math.round(o.kg*100)/100);return o}
function vociTutte(){
  const out=[];
  GIORNI.forEach(function(g){g.blocks.forEach(function(b,bi){
    if(norec(b)) return;
    const bk=g.id+"_"+bi, rm=testDi(b), uS=unitaDi(b)==="s", T=rifT(bk);
    if(rm&&T>0){
      const tw=settDelTest(b); let ri=b.rows.findIndex(function(r){return settimanaDi(r)===tw}); if(ri<0) ri=0;
      const r0=b.rows[ri], rr=uS?Math.round(T):(parseInt(rm)||0);
      if(rr) out.push(voce({k:bk+"_"+ri,i:0,ty:"rm",rm:rm,ex:exDi(b,r0,0,null),nome:b.nome,kg:uS?0:T,r:rr,u:uS?"s":"",n:1,
        d:durDi(b,r0,0),w:tw,g:g.id,cl:b.colpilab||""}));
    }
    b.rows.forEach(function(r,ri){vociRiga(out,g,b,bk,r,ri)});
  })});
  return out;
}
function vociRiga(out,g,b,bk,r,ri){
  const k=bk+"_"+ri, w=settimanaDi(r), pz=parti(r), ts=tipoSerie(r.se), nomi=nomiParti(b,pz.length), uS=unitaDi(b)==="s";
  const variante=b.dur!==undefined||!durZero(durDa(b.nome));
  function base(i,ty){const d=durDi(b,r,i), ex=exDi(b,r,i,nomi);
    return {k:k,i:i,ty:ty,ex:ex,nome:(nomi&&nomi[i])||((variante&&durZero(d))?ex:b.nome),d:d,w:w,g:g.id,cl:b.colpilab||""}}
  const rm=testDi(b), nt=num(state["NT_"+k]);
  if(rm&&nt>0){const o=base(0,"rm");o.rm=rm;o.kg=uS?0:nt;o.r=uS?Math.round(nt):(parseInt(rm)||0);o.u=uS?"s":"";o.n=1;if(o.r)out.push(voce(o))}
  pz.forEach(function(p,i){
    const c=String(p.ca||"");
    if(/^(RPE\s*\d|@\s*\d|MAV$)/i.test(c)){const v=num(state["RK_"+k+"_"+i]);
      if(v>0){const mav=/^MAV$/i.test(c),o=base(i,mav?"mav":"top");if(mav)o.ex+=" · MAV";
        o.kg=v;o.r=mav?1:(parseInt(p.rp)||0);o.u="";o.n=1;o.rpe=rpeDi(c);if(o.r)out.push(voce(o))}}
    if(isMax(p.rp)){const a=numeri(state["MX_"+k+"_"+i]);
      if(a.length){const o=base(i,"max");
        if(isMaxTempo(p.rp)||uS){o.kg=0;o.u="s"}else{const kv=kgNum(p,bk,b,k,i);o.kg=Array.isArray(kv)?Math.max.apply(null,kv):kv;o.u=""}
        o.r=Math.round(Math.max.apply(null,a));o.n=1;if(isFinite(o.kg)&&o.r)out.push(voce(o))}}
  });
  /* le serie fatte: dal tasto; prima del tasto, una riga compilata (kg o fatica) vale come fatta */
  const S=serieDi(r); if(!S) return;
  const tot=S.length; let c=Math.min(parseInt(state["CS_"+k])||0,tot);
  if(!c){let ev=!!state["fp_"+k];for(let i=0;i<6&&!ev;i++)if(String(state["U_"+k+"_"+i]||"").trim()||String(state["W_"+k+"_"+i]||"").trim())ev=true;if(ev)c=tot}
  if(!c) return;
  const fatte=[];                                         /* {i, rp, j (indice della serie dentro il pezzo), nP} */
  if(ts.t==="giri"){const gd=Math.min(c,ts.n);
    pz.forEach(function(p,i){for(let j=0;j<gd;j++)fatte.push({i:i,rp:p.rp,j:j,nP:ts.n})});
    const ex=Math.max(0,c-ts.n),li=pz.length-1;for(let j=0;j<ex;j++)fatte.push({i:li,rp:pz[li].rp,j:j,nP:ts.extra});
  } else if(ts.t==="ramp"&&ts.extra){const ii=pz[1]?1:0;for(let j=0;j<c;j++)fatte.push({i:ii,rp:pz[ii].rp,j:j,nP:ts.extra})}
  else {const lista=[];
    pz.forEach(function(p,i){if(ts.t==="ramp"&&i===0)return;
      const n=parseInt(p.se)||0, rr=String(p.rp).split("-").map(function(x){return x.trim()});
      for(let j=0;j<n;j++)lista.push({i:i,rp:(rr.length===n?rr[j]:p.rp),j:j,nP:n})});
    lista.slice(0,c).forEach(function(x){fatte.push(x)});
  }
  const gruppi={};
  fatte.forEach(function(x){
    const p=pz[x.i]; if(!p||p.ca==="__TEST__"||p.ca==="__NUOVO__"||isMax(p.rp)||isMezzoMax(p.rp)) return;
    let kgv, rr, u="";
    if(uS){kgv=0;rr=secNum(p,bk,k);u="s"}
    else{
      const sd=secDa(x.rp); const kv=kgNum(p,bk,b,k,x.i);
      kgv=Array.isArray(kv)?(kv.length===x.nP?kv[x.j]:Math.max.apply(null,kv.filter(function(z){return isFinite(z)}))):kv;
      if(sd>0){rr=sd;u="s";if(!isFinite(kgv)&&/corpo libero/i.test(String(p.ca)))kgv=0}
      else{const mr=String(x.rp).trim().match(/^[−\-](\d+)$/);
        if(mr){const src=relSrc(k,bk),tp=num(state[src]);rr=(isFinite(tp)&&tp>0)?Math.max(1,tp-parseInt(mr[1])):NaN}
        else rr=parseInt(x.rp)}
    }
    if(!isFinite(kgv)||!isFinite(rr)||rr<=0) return;
    const key=x.i+"|"+rr+"|"+kgv;
    if(!gruppi[key]){const o=base(x.i,"set");o.kg=kgv;o.r=Math.round(rr);o.u=u;o.n=0;gruppi[key]=o}
    gruppi[key].n++;
  });
  Object.keys(gruppi).forEach(function(key){out.push(voce(gruppi[key]))});
}
/* i massimali testati dal coach sono voci di partenza (programma 0) */
function vociMassimali(){
  const out=[];
  MASS.forEach(function(m){if(!m.ex||!/testat/i.test(m.nota||""))return;const v=num(m.def);if(!(v>0))return;
    out.push({id:"MASS|"+PERSONA+"|"+m.id,ls:"massimali",k:"",i:0,ty:"rm",rm:"1RM",ex:norm(m.ex),nome:m.lab,kg:v,r:1,u:"",n:1,d:[0,0,0],
      w:0,g:"",pg:"massimale "+String(m.nota).replace(/^testato\s*/i,""),pgn:0,cl:""})});
  return out;
}
function ricostruisci(){
  const V=vociTutte();
  Object.keys(STO.e).forEach(function(id){if(STO.e[id].ls===LS)delete STO.e[id]});
  V.forEach(function(e){STO.e[e.id]=e});
  vociMassimali().forEach(function(e){STO.e[e.id]=e});
  /* "gia' festeggiato" vale solo finche' il dato resta uguale: se lo togli, lo cambi o annulli una serie,
     la volta dopo che lo rimetti e chiudi le serie il record suona di nuovo (2026-11-03) */
  Object.keys(STO.fe).forEach(function(id){const e=STO.e[id];if(!e||firma(e)!==STO.fe[id])delete STO.fe[id]});
  delete STO.fr;
  salvaSto(); return V;
}
function tutteLeVoci(){return Object.keys(STO.e).map(function(id){return STO.e[id]})}

/* il confronto con tutto quello che c'era prima (settimane prima, programmi prima) */
function rpeV(e){return e.ty==="top"?(e.rpe!=null?e.rpe:null):((e.ty==="rm"||e.ty==="max")?10:null)}  /* test, massimale, MAX = al limite */
function prima(e,P){return e.pgn<P.pgn||(e.pgn===P.pgn&&e.w<P.w)}
function miglior(a,campo){return a.reduce(function(x,y){return y[campo]>x[campo]?y:x})}
function confronta(P,tutte){
  const prev=tutte.filter(function(e){return e.ex===P.ex&&e.u===P.u&&prima(e,P)});
  if(!prev.length) return null;
  const C=prev.filter(function(e){return durMag(e.d,P.d)});        /* fatte almeno cosi' dure */
  const dom=C.some(function(e){return e.kg>=P.kg-EPS&&e.r>=P.r});
  const fac=[];
  if(!dom){
    const sr=C.filter(function(e){return e.r===P.r});
    if(sr.length){const q=miglior(sr,"kg");if(P.kg>q.kg+EPS)fac.push({t:"peso",q:q})}
    if(!fac.length){const sk=C.filter(function(e){return Math.abs(e.kg-P.kg)<EPS});
      if(sk.length){const q=miglior(sk,"r");if(P.r>q.r)fac.push({t:"colpi",q:q})}}
  }
  /* stesso peso e stessi colpi, ma piu' facile: prima @8, oggi @7 (o prima era il test o il massimale, cioe' @10) */
  if(P.rpe!=null){
    const A=C.filter(function(e){return e.r>=P.r});
    const inCima=A.length&&P.kg>=Math.max.apply(null,A.map(function(e){return e.kg}))-EPS;
    const R=C.filter(function(e){return Math.abs(e.kg-P.kg)<EPS&&e.r===P.r&&rpeV(e)!=null});
    const gia=C.some(function(e){return e.kg>=P.kg-EPS&&e.r>=P.r&&rpeV(e)!=null&&rpeV(e)<=P.rpe});
    if(inCima&&R.length&&!gia) fac.push({t:"facile",q:R.reduce(function(x,y){return rpeV(y)<rpeV(x)?y:x})});
  }
  if(!durZero(P.d)){                                                  /* al livello piu' alto, ma piu' dura */
    const A=prev.filter(function(e){return e.r>=P.r});
    if(A.length&&P.kg>=Math.max.apply(null,A.map(function(e){return e.kg}))-EPS){
      const facili=prev.filter(function(e){return e.kg>=P.kg-EPS&&e.r>=P.r&&durPiu(P.d,e.d)});
      const gia=prev.some(function(e){return e.kg>=P.kg-EPS&&e.r>=P.r&&durMag(e.d,P.d)});
      if(facili.length&&!gia)fac.push({t:"dura",q:facili.reduce(function(x,y){return (y.d[0]+y.d[1]+y.d[2])>(x.d[0]+x.d[1]+x.d[2])?y:x})});
    }
  }
  if(P.n>1){                                                          /* stesso peso e colpi, piu' serie */
    const A=C.filter(function(e){return e.r>=P.r});
    if(A.length&&P.kg>=Math.max.apply(null,A.map(function(e){return e.kg}))-EPS){
      const Sx=C.filter(function(e){return e.kg>=P.kg-EPS&&e.r===P.r});
      if(Sx.length){const q=miglior(Sx,"n");if(P.n>q.n)fac.push({t:"serie",q:q})}}
  }
  /* la "piu' dura" parla da sola solo quando eguagli il test (o il massimale) in versione piu' dura;
     se c'e' gia' piu' peso o piu' colpi, basta quello */
  const fd=fac.find(function(x){return x.t==="dura"});
  if(fd&&fac.some(function(x){return x.t==="peso"||x.t==="colpi"})){
    if(fd.q.ty==="rm"&&P.r>=fd.q.r&&Math.abs(P.kg-fd.q.kg)<EPS) fd.primo=true;
    else fac.splice(fac.indexOf(fd),1);
  }
  return fac.length?fac:null;
}
const ORDINE={peso:0,colpi:1,facile:2,dura:3,serie:4};
function ordinaFac(fac){fac.sort(function(a,b){return (b.primo?1:0)-(a.primo?1:0)||ORDINE[a.t]-ORDINE[b.t]});return fac}
function firma(e){return e.kg+"|"+e.r+"|"+e.n+"|"+e.d.join(",")}
function cercaRecord(filtro){
  const tutte=tutteLeVoci(), cand=[];
  tutte.forEach(function(e){if(e.ls!==LS||!filtro(e))return;
    const fac=confronta(e,tutte); if(!fac) return;
    if(STO.fe[e.id]===firma(e)) return;                              /* gia' festeggiato questo */
    ordinaFac(fac);
    cand.push({e:e,fac:fac})});
  if(!cand.length) return null;
  cand.forEach(function(c){STO.fe[c.e.id]=firma(c.e)}); salvaSto();
  cand.sort(function(a,b){return ((a.fac[0].primo?0:1)-(b.fac[0].primo?0:1))||(ORDINE[a.fac[0].t]-ORDINE[b.fac[0].t])||(b.e.kg-a.e.kg)});
  return cand[0];
}

/* le parole del record */
function cap(s){s=String(s||"").trim().toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)}
function colpiTxt(e){if(e.u==="s")return e.r+" secondi";return e.r===1?"1 colpo":e.r+" "+(e.cl||"colpi")}
function aKg(e){return e.kg>0?"a "+f(e.kg)+" kg":"a corpo libero"}
function quando(q,P){
  /* quando, e se quella volta era in un'altra versione, quale */
  const dq=(!durZero(q.d)&&durTxt(q.d)!==durTxt(P.d))?durTxt(q.d):"";
  const pz=[];
  if(q.pgn===0) pz.push(q.pg);
  else{if(q.w)pz.push("S"+q.w);if(q.pgn!==P.pgn)pz.push(q.pg)}
  if(dq) pz.push(dq);
  return pz.length?" ("+pz.join(", ")+")":"";
}
function titoloRec(fac,e){
  return fac.map(function(x){
    if(x.t==="peso") return e.ty==="rm"?"Nuovo "+e.rm:(e.ty==="top"?"Top più alto":(e.ty==="mav"?"MAV più alta":"Più peso"));
    if(x.t==="colpi") return e.u==="s"?"Più tempo":"Più colpi";
    if(x.t==="facile") return "Più facile";
    if(x.t==="dura") return "Più dura";
    return e.u==="s"?"Più tenute":"Più serie";
  }).join(" · ");
}
function testoRec(fac,e){
  const x=fac[0], q=x.q, nm=cap(e.nome), dt=durTxt(e.d), dur=dt?" "+dt:"", qd=quando(q,e);
  if(x.t==="peso"){
    if(e.ty==="rm") return nm+": il tuo "+e.rm+" ora è "+f(e.kg)+" kg. Era "+f(q.kg)+" kg"+qd+".";
    if(e.ty==="top") return nm+": "+f(e.kg)+" kg per "+colpiTxt(e)+(e.rpe?" @"+f(e.rpe):"")+dur+". Prima, a "+colpiTxt(q)+", il massimo era "+f(q.kg)+" kg"+qd+".";
    if(e.ty==="mav") return nm+": MAV a "+f(e.kg)+" kg. Prima "+f(q.kg)+" kg"+qd+".";
    if(e.u==="s") return nm+": "+e.r+" secondi con "+f(e.kg)+" kg"+dur+". Prima, per "+e.r+" secondi, il massimo era "+f(q.kg)+" kg"+qd+".";
    return nm+": "+colpiTxt(e)+" "+aKg(e)+dur+". Prima, a "+colpiTxt(q)+dur+", il massimo era "+f(q.kg)+" kg"+qd+".";
  }
  if(x.t==="colpi"){
    if(e.u==="s") return nm+": "+e.r+" secondi"+(e.kg>0?" con "+f(e.kg)+" kg":"")+dur+". Prima il massimo era "+q.r+" secondi"+qd+".";
    if(q.ty==="rm") return nm+": "+colpiTxt(e)+" "+aKg(e)+dur+". Era il tuo peso da "+q.r+qd+".";
    return nm+": "+colpiTxt(e)+" "+aKg(e)+dur+". Finora a quel peso"+(dt?", "+dt+",":"")+" "+(q.r===1?"ne avevi fatto al massimo 1":"ne avevi fatti al massimo "+q.r)+qd+".";
  }
  if(x.t==="facile") return nm+": "+f(e.kg)+" kg per "+colpiTxt(e)+" @"+f(e.rpe)+dur+". "+
    (q.ty==="top"?"Prima lo stesso peso era @"+f(q.rpe):"Prima a quel peso era il tuo "+(q.ty==="rm"?q.rm:"massimo")+", al limite")+qd+".";
  if(x.t==="dura") return nm+": "+colpiTxt(e)+" "+aKg(e)+" "+dt+". Finora, a quel peso per "+colpiTxt(e)+", solo "+(durZero(q.d)?"a ritmo normale":durTxt(q.d))+qd+".";
  if(e.u==="s") return nm+": "+e.n+" tenute da "+e.r+" secondi. Finora a quel tempo "+(q.n===1?"ne avevi fatta al massimo una":"ne avevi fatte al massimo "+q.n)+qd+".";
  return nm+": "+e.n+" serie da "+colpiTxt(e)+" "+aKg(e)+dur+". Finora a quel peso"+(dt?", "+dt+",":"")+" "+(q.n===1?"ne avevi fatta al massimo una":"ne avevi fatte al massimo "+q.n)+qd+".";
}
function festaRecord(c){festa(titoloRec(c.fac,c.e),testoRec(c.fac,c.e))}

/* quando guardare: un numero scritto (test, top, MAX, MAV, nuovo test) o l'ultima serie segnata.
   I kg usati di una riga col tasto Serie fatta aspettano la fine delle serie. */
const RECT={};
function guardaRecord(kk,subito){
  clearTimeout(RECT.t);
  RECT.t=setTimeout(function(){
    ricostruisci();
    let m, filtro=null;
    if((m=kk.match(/^T_([A-Z]_\d+)$/))){const bk=m[1];filtro=function(e){return e.ty==="rm"&&e.k.indexOf(bk+"_")===0}}
    else if((m=kk.match(/^(?:NT_|RK_|MX_)([A-Z]_\d+_\d+)/))){const k=m[1];filtro=function(e){return e.k===k}}
    else if((m=kk.match(/^(?:U_|W_)([A-Z]_\d+_\d+)_\d+(?:_s\d+)?$/))){const k=m[1],x=rigaObj(k),S=serieDi(x.r),c=parseInt(state["CS_"+k])||0;
      if(!(haCs(x.r,x.b)&&S&&c<S.length)) filtro=function(e){return e.k===k}}
    if(!filtro) return;
    const rec=cercaRecord(filtro); if(rec) festaRecord(rec);
  },subito?60:1400);
}

/* suoni: lo stesso vetro. Serie fatta = due tocchi (A); record = i due tocchi e poi la campana (B) */
const VETRO=[[1,1],[2.76,0.28],[5.4,0.08]];
/* audio: iPhone sospende o "interrompe" il suono quando l'app va in secondo piano o lo schermo si spegne.
   A ogni tocco lo si risveglia (con un suono muto, il trucco classico di Safari), e prima di ogni suono si
   controlla che sia acceso davvero (2026-11-03) */
function audio(){
  try{
    if(!ACTX||ACTX.state==="closed") ACTX=new (window.AudioContext||window.webkitAudioContext)();
    if(ACTX.state!=="running"){const p=ACTX.resume();if(p&&p.catch)p.catch(function(){})}
  }catch(e){}
  return ACTX;
}
function sblocca(){
  const a=audio(); if(!a) return;
  try{const b=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(0)}catch(e){}
  diagAudio();
}
["touchend","click","keydown"].forEach(function(ev){document.addEventListener(ev,sblocca,{capture:true,passive:true})});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&ACTX&&ACTX.state!=="running")audio()});
function busVetro(g){const a=audio();const o=a.createGain();o.gain.value=g;o.connect(a.destination);return o}
function tocco(out,fr,t0,d,g){const t=ACTX.currentTime+0.02+t0;
  VETRO.forEach(function(h){const o=ACTX.createOscillator(),e=ACTX.createGain();
    o.type="sine";o.frequency.value=fr*h[0];o.connect(e);e.connect(out);
    e.gain.setValueAtTime(0.0001,t);e.gain.exponentialRampToValueAtTime((g||1)*h[1],t+0.004);
    e.gain.exponentialRampToValueAtTime(0.0001,t+(h[0]===1?d:d*0.4));o.start(t);o.stop(t+d+0.05)})}
function suonoRecord(){try{const o=busVetro(.55);tocco(o,2093,0,.32);tocco(o,2794,.095,.32);tocco(o,3136,.3,1.6,1)}catch(e){}}

function festa(titolo,testo){
  try{if(navigator.vibrate) navigator.vibrate([40,60,40,60,140])}catch(e){}
  suonoRecord();
  let el=document.getElementById("festa");
  if(!el){el=document.createElement("div");el.id="festa";el.setAttribute("role","status");document.body.appendChild(el);
    el.addEventListener("click",function(){el.className=""});}
  el.innerHTML='<b></b><span></span>'; el.querySelector("b").textContent=titolo; el.querySelector("span").textContent=testo;
  el.className="on"; clearTimeout(el._t); el._t=setTimeout(function(){el.className=""},5200);
  if(!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)) coriandoli();
}

function coriandoli(){
  const cv=document.createElement("canvas"), dpr=Math.min(window.devicePixelRatio||1,2);
  cv.id="coriandoli"; document.body.appendChild(cv);
  const W=innerWidth,H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr);
  const col=["#C9A961","#A9863B","#E9D9B0","#FFFFFF","#23232A"], P=[];
  for(let n=0;n<150;n++){const da=n%2?1:-1;            /* due getti dagli angoli in basso */
    P.push({x:da<0?-10:W+10,y:H*0.72,vx:da*(-(3+Math.random()*7)),vy:-(9+Math.random()*9),g:0.32+Math.random()*0.1,
      w:5+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*0.35,c:col[n%col.length],tondo:Math.random()<.25});}
  const t0=performance.now();
  (function step(now){
    const e=now-t0; c.clearRect(0,0,W,H);
    P.forEach(function(p){p.vy+=p.g;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      c.save();c.globalAlpha=Math.max(0,1-Math.max(0,e-1800)/700);c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;
      if(p.tondo){c.beginPath();c.arc(0,0,p.h/1.6,0,6.28);c.fill()}else c.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      if(p.c==="#FFFFFF"){c.strokeStyle="rgba(169,134,59,.35)";c.lineWidth=.6;c.strokeRect(-p.w/2,-p.h/2,p.w,p.h)}
      c.restore();});
    if(e<2500) requestAnimationFrame(step); else cv.remove();
  })(t0);
}

/* ---------- EMOM: 10" per mettersi sotto, poi un beep a ogni minuto ---------- */
let EMOMT=null, ACTX=null;
function beep(n,freq){
  /* onda quadra, due toni sovrapposti, compressore a valle: il massimo che un telefono tira fuori */
  try{
    audio();
    const comp=ACTX.createDynamicsCompressor();
    comp.threshold.value=-6; comp.knee.value=0; comp.ratio.value=20; comp.attack.value=0.001; comp.release.value=0.05;
    const out=ACTX.createGain(); out.gain.value=1.0; comp.connect(out); out.connect(ACTX.destination);
    for(let i=0;i<n;i++){
      const t=ACTX.currentTime+i*0.42;
      [freq||1760,(freq||1760)*1.5].forEach(function(fr){
        const o=ACTX.createOscillator(), g=ACTX.createGain();
        o.type="square"; o.frequency.value=fr; o.connect(g); g.connect(comp);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(1.0,t+0.008);
        g.gain.setValueAtTime(1.0,t+0.28); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
        o.start(t); o.stop(t+0.36);
      });
    }
  }catch(e){}
  try{if(navigator.vibrate) navigator.vibrate(n===1?250:[250,150,250,150,250])}catch(e){}
  lampo(n);
}
function lampo(n){
  let el=document.getElementById("lampo");
  if(!el){el=document.createElement("div");el.id="lampo";document.body.appendChild(el)}
  let c=0;
  (function uno(){ el.className="on"; setTimeout(function(){el.className="";if(++c<n)setTimeout(uno,140)},260) })();
}
function emomToggle(k,min,btn){
  if(EMOMT&&EMOMT.k===k){emomStop();return}
  emomStop();
  const box=document.getElementById("emom_"+k); if(!box) return;
  const disp=box.querySelector(".ed");
  beep(1,1175);                                  /* sblocca l'audio col tocco */
  let wl=null; try{if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){wl=w}).catch(function(){})}catch(e){}
  const t0=Date.now(), prep=10; let lastMin=-1, lastPrep=-1;
  btn.textContent="Ferma"; btn.className="eb on";
  function tick(){
    const s=(Date.now()-t0)/1000;
    if(s<prep){
      const r=Math.ceil(prep-s);
      if(r<=3&&r!==lastPrep){lastPrep=r;beep(1,1175)}
      disp.innerHTML='<b>'+r+'</b><em>mettiti sotto</em>'; return;
    }
    const e=s-prep, m=Math.floor(e/60), sec=Math.floor(e%60);
    if(m>=min){ disp.innerHTML='<b>FINE</b><em>'+min+' minuti fatti</em>'; beep(3,1760); emomStop(true); return; }
    if(m!==lastMin){lastMin=m;beep(m===0?2:1,1760)}
    disp.innerHTML='<b>'+(m+1)+'<small>/'+min+'</small></b><em>minuto</em><span class="es">'+(sec<10?"0":"")+sec+'\u2033</span>';
  }
  EMOMT={k:k,iv:setInterval(tick,200),btn:btn,disp:disp,min:min,getWl:function(){return wl}};
  tick();
}
function emomStop(fine){
  if(!EMOMT) return;
  clearInterval(EMOMT.iv);
  try{const w=EMOMT.getWl(); if(w) w.release()}catch(e){}
  EMOMT.btn.textContent="Avvia EMOM"; EMOMT.btn.className="eb";
  if(!fine) EMOMT.disp.innerHTML='<b>\u2014</b><em>EMOM '+EMOMT.min+'\u2032</em>';
  EMOMT=null;
}

/* ---------- riepilogo per il coach ---------- */
function segnato(){
  const out=[];
  GIORNI.forEach(function(g){g.blocks.forEach(function(b,bi){
    const bk=g.id+"_"+bi;
    const T=state["T_"+bk];
    if(T&&String(T).trim()) out.push({g:g.id,nome:b.nome,riga:testDi(b)+": "+T+" kg"});
    b.rows.forEach(function(r,ri){
      const k=bk+"_"+ri, pezzi=[];
      const fp=state["fp_"+k], ap=state["ap_"+k], sf=state["SF_"+k];
      if(sf) pezzi.push("serie fatte "+sf);
      const nomi=nomiBlocco(b);
      for(let i=0;i<6;i++){const mx=state["MX_"+k+"_"+i], rk=state["RK_"+k+"_"+i], w=state["W_"+k+"_"+i];
        const chi=nomi&&nomi[i]?nomi[i].toLowerCase()+" ":"";
        if(mx) pezzi.push(chi+"MAX: "+mx); if(rk) pezzi.push(chi+"a RPE: "+rk+" kg"); if(w) pezzi.push(chi+"peso usato "+w+" kg");
        const u=state["U_"+k+"_"+i]; if(u) pezzi.push(chi+"kg usati "+u);}
      const nt=state["NT_"+k]; if(nt&&String(nt).trim()) pezzi.push("nuovo test "+String(nt).trim()+" "+uLab(b));
      const cs=parseInt(state["CS_"+k])||0; if(cs){const S=serieDi(r);pezzi.push((S&&S[0].lab==="giro"?"giri fatti ":"serie fatte ")+cs+(S?"/"+S.length:""))}
      if(b.regola&&/MAX/i.test(String(r.rp||""))&&state["MX_"+k+"_0"]) pezzi.push("peso "+kg(pesoGiorno(bk,b,ri)));
      if(fp) pezzi.push("fatica "+fp+"/10");
      if(ap&&String(ap).trim()) pezzi.push(String(ap).trim());
      if(pezzi.length) out.push({g:g.id,nome:r.s+" "+b.nome,riga:pezzi.join(" — ")});
    });
  })});
  return out;
}

/* ---------- archivio: una copia di quello che segni arriva al coach (foglio Google del coach) ----------
   All'apertura parte tutto quello che c'e' gia' sul telefono (anche le settimane passate); poi una copia
   15 secondi dopo l'ultima cosa segnata, e subito quando si chiude o si cambia app. Senza rete non succede
   niente: i dati restano sul telefono e partono alla volta dopo. */
(function(){
  if(typeof ARCH0==="undefined"||!ARCH0) return;
  let T=null;
  function dove(){const ua=navigator.userAgent, app=(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));
    return (app?"app":"browser")+" \u00b7 "+(/iPhone|iPad/.test(ua)?"iPhone":(/Android/.test(ua)?"Android":"computer"))}
  function pacco(){const seg=segnato();
    return {n:seg.length,corpo:JSON.stringify({k:ARCHK0,p:PERSONA,ls:LS,pg:PROG,tit:TITOLO,n:seg.length,seg:seg,st:state,sto:STO,ua:dove()})}}
  function giaMandato(){try{return parseInt(localStorage.getItem(LS+"__archN"))||0}catch(e){return 0}}
  function ricorda(n){try{localStorage.setItem(LS+"__archN",String(n));localStorage.setItem(LS+"__archT",String(Date.now()))}catch(e){}}
  function invia(beacon){
    T=null; const p=pacco();
    if(!p.n&&!giaMandato()) return;                       /* niente da archiviare, e mai mandato niente da qui */
    if(beacon&&navigator.sendBeacon){try{if(navigator.sendBeacon(ARCH0,new Blob([p.corpo],{type:"text/plain;charset=utf-8"}))){ricorda(p.n);return}}catch(e){}}
    try{fetch(ARCH0,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:p.corpo})
      .then(function(){ricorda(p.n)}).catch(function(){})}catch(e){}
  }
  window.mandaArchivio=function(dopo){clearTimeout(T);T=setTimeout(invia,dopo==null?15000:dopo)};
  const salvaSoloQui=save; save=function(){salvaSoloQui();mandaArchivio()};
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&T){clearTimeout(T);invia(true)}});
  window.addEventListener("pagehide",function(){if(T){clearTimeout(T);invia(true)}});
  const ft=document.querySelector("footer"); if(ft) ft.textContent="Quello che scrivi resta su questo telefono e arriva anche al tuo coach.";
  mandaArchivio(2000);
})();

}
function minimizzaInstalla(){
  try{localStorage.setItem("ncp-inst-min","1")}catch(x){}
  mostraInstalla(document.getElementById("inst").dataset.modo||"ios");
}
function comeInstallare(){
  /* i passi si aprono solo quando tocchi «Installa l'app»; un secondo tocco li richiude */
  const p=document.getElementById("passi"); if(!p) return;
  if(p.innerHTML){p.innerHTML="";return}
  let h='<ol class="passi">';
  if(isAndroid()){
    h+='<li><b>Apri questa pagina in Chrome.</b> Da WhatsApp o da un\u2019altra app l\u2019installazione non c\u2019\u00e8.'+
      '<div class="riga"><button onclick="apriChrome()">Apri in Chrome</button>'+
      '<button class="no" onclick="copiaLink(this)">Copia il link</button></div></li>'+
      '<li>In Chrome tocca i <b>tre puntini</b> in alto a destra</li>'+
      '<li>Scegli <b>Installa app</b> <span class="pic">(oppure \u00abAggiungi a schermata Home\u00bb)</span></li>'+
      '<li>Conferma</li></ol>';
    p.innerHTML=h; return;
  }
  if(inAppBrowser()){
    h+='<li><b>Prima apri questa pagina in Safari.</b> Da WhatsApp e dalle altre app '+
      'l’installazione non esiste: serve Safari.<br>'+
      '<span class="pic">Cerca in basso il tasto con i tre puntini o la bussola e scegli '+
      '«Apri in Safari». Oppure copia il link qui sotto e incollalo in Safari.</span>'+
      '<div class="riga"><button onclick="apriSafari()">Apri in Safari</button>'+
      '<button class="no" onclick="copiaLink(this)">Copia il link</button></div></li>';
  }
  h+='<li>In Safari tocca il tasto <b>Condividi</b> <span class="ic">'+SVGCOND+'</span>, '+
    'nella barra in fondo allo schermo.<br><span class="pic">Non la vedi? Tocca una volta '+
    'il fondo dello schermo: la barra ricompare.</span></li>'+
    '<li>Scorri l’elenco e scegli <b>Aggiungi a Home</b> '+
    '<span class="pic">(in inglese: Add to Home Screen)</span></li>'+
    '<li>Conferma in alto a destra</li></ol>';
  if(!inAppBrowser())
    h+='<div class="riga"><button class="no" onclick="copiaLink(this)">Copia il link</button></div>';
  p.innerHTML=h;
}
function copiaLink(b){
  const u=location.origin+location.pathname;
  function fatto(){b.textContent="Copiato ✓"; setTimeout(function(){b.textContent="Copia il link"},2500)}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(fatto).catch(function(){prompt("Copia il link:",u)});
  } else { prompt("Copia il link:",u) }
}
function apriChrome(){
  location.href="intent://"+location.host+location.pathname+"#Intent;scheme=https;package=com.android.chrome;end";
}
function apriSafari(){
  location.href="x-safari-"+location.origin+location.pathname;
}
function installa(){
  if(!PROMPT) return;
  PROMPT.prompt();
  PROMPT.userChoice.then(function(){PROMPT=null;
    const e=document.getElementById("inst"); if(e) e.style.display="none"});
}
function nienteInstalla(){
  try{localStorage.setItem("ncp-no-inst","1")}catch(e){}
  const e=document.getElementById("inst"); if(e) e.style.display="none";
}
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); PROMPT=e; mostraInstalla("android")});
(function(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  setTimeout(function(){
    if(!giaInstallata()&&!PROMPT) mostraInstalla(ios?"ios":"altro");
  },900);
})();


</script></body></html>
