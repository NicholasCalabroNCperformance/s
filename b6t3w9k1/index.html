function kg(x){return f(Math.round(x*10)/10)+" kg"}   /* nessun arrotondamento al gradino */

  return '<input type="text" inputmode="decimal" class="mini" data-k="'+k+'" value="'+esc(state[k]||"")+
    '" placeholder="'+(segn||"")+'"'+(largo?' style="width:'+largo+'px"':'')+'>';
}

/* ---------- riferimenti di un esercizio ---------- */
const RE_TEST=/TEST\s*([\d–\-]+\s*RM)/i;
function testDi(b){
  for(const r of b.rows){
    const m=(String(r.ca||"")+" "+String(r.rp||"")).match(RE_TEST);
    if(m) return m[1].replace(/\s+/g,"").toUpperCase();
  }
  return null;
}
function settDelTest(b){
  for(let i=0;i<b.rows.length;i++)
    if(RE_TEST.test(String(b.rows[i].ca||"")+" "+String(b.rows[i].rp||"")))
      return parseInt(String(b.rows[i].s).replace(/\D/g,""))||1;
  return 1;
}
function vuoleLavoro(b){return b.rows.some(r=>/peso di lavoro/i.test(String(r.ca||"")))}
function rifT(bk){return num(state["T_"+bk])}
function pesoLavoro(bk,k,i){
  /* il peso scritto in questa riga per questo pezzo; se manca, l'ultimo scritto nelle righe prima */
  const v=state["W_"+k+"_"+i]; if(v!==undefined&&String(v).trim()!=="") return num(v);
  const ri=parseInt(k.slice(k.lastIndexOf("_")+1))||0;
  for(let r=ri-1;r>=0;r--){const w=state["W_"+bk+"_"+r+"_"+i]; if(w!==undefined&&String(w).trim()!=="") return num(w);}
  return NaN;
}
function nomiBlocco(b){
  for(const r of b.rows){const n=nomiParti(b,parti(r).length); if(n) return n}
  return null;
}

/* ---------- tipo di riga, dalla colonna Serie ---------- */
function tipoSerie(se){
  const s=String(se||"").trim(); let m;
  if(!s||s==="—"||s==="-") return {t:"nessuna"};
  if((m=s.match(/^(\d+)\s*(onde|onda|giri|giro|round|rounds)(?:\s*\+\s*(\d+))?$/i)))
    return {t:"giri",n:+m[1],extra:m[3]?+m[3]:0,parola:/ond/i.test(m[2])?"onde":"giri"};
  if((m=s.match(/^(ramp(?:ing)?)(?:\s*\+\s*(\d+))?$/i))) return {t:"ramp",extra:m[2]?+m[2]:0};
  if(/^N(\s*\/.*)?$/i.test(s)) return {t:"n"};
  if(/^[\d\s\/\-–]+$/.test(s)) return {t:"num"};
  return {t:"testo",se:s};
}

/* ---------- i pezzi di una riga (reps e carichi allineati sulla barra) ---------- */
function parti(r){
  const se=String(r.se||"").split("/").map(x=>x.trim());
  const rp=String(r.rp||"").replace(/MAX\s*\/\s*2/gi,"MAX\u00bd").split("/").map(x=>x.trim());
  const ca=String(r.ca||"").trim();
  const mt=ca.match(/^TEST\s*[\d–\-]+\s*RM\s*,\s*poi\s+(.+)$/i);
  const cav=mt?null:ca.split("/").map(x=>x.trim());
  const n=Math.max(se.length,rp.length,cav?cav.length:1);
  const out=[];
  for(let i=0;i<n;i++){
    const p={se:(se[i]!==undefined?se[i]:se[0]), rp:(rp[i]!==undefined?rp[i]:rp[0]),
             ca:(mt?(i===0?"__TEST__":mt[1]):(cav[i]!==undefined?cav[i]:cav[0]))};
    const tm=String(p.rp).match(RE_TEST);
    if(tm){p.test=tm[1].replace(/\s+/g,"").toUpperCase();p.rp=tm[1].split(/[–\-]/)[0].replace(/\D/g,"");p.ca="__TEST__";}
    if(/^TEST\b/i.test(p.ca)) p.ca="__TEST__";
    out.push(p);
  }
  return out;
}
function nomiParti(b,n){
  /* "CURL + FRENCH PRESS — superserie": i nomi dei pezzi vengono dal titolo */
  const t=String(b.nome||"");
  const pz=t.split(/\s*(?:\+|\/)\s*/).map(x=>x.trim()).filter(Boolean);
  return pz.length===n&&n>1?pz:null;
}

/* ---------- carico ---------- */
function sconto(t){const m=t.match(/[−\-]\s*(\d+(?:[.,]\d+)?)\s*%/);return m?(1-parseFloat(m[1].replace(",","."))/100):1}
function daTest(t,T){
  if(!isFinite(T)||T<=0) return '<span class="wait">dopo il test</span><span class="raw">'+t+'</span>';
  if(/\+\s*1\s*gradino/i.test(t)) return f(T)+' kg <span class="lieve">+ 1 gradino</span><span class="raw">'+t+'</span>';
  return kg(T*sconto(t))+'<span class="raw">'+t+'</span>';
}
function risolvi(t,bk,b,k,i){
  t=String(t||"").trim(); k=k||""; i=i||0;
  if(!t||t==="—") return "";
  const T=rifT(bk); let m;
  if(t==="__TEST__"){
    /* la serie del test: scritto TEST 10RM, e appena il test e' compilato anche il peso */
    const rm=testDi(b)||"";
    return '<span class="tst">TEST '+rm+'</span>'+((isFinite(T)&&T>0)?' <span class="freccia">=</span> '+kg(T):'');
  }
  /* peso del test, 5RM -15%, -20% da solo */
  if(/peso del test/i.test(t)) return daTest(t,T);
  if(/^\d+\s*RM\s*[−\-]\s*\d+\s*%/i.test(t)) return daTest(t,T);
  if(/^[−\-]\s*\d+\s*%$/.test(t)) return daTest(t,T);
  /* peso di lavoro: lo scrive lui accanto ai colpi; se c'e' uno sconto, il risultato esce di fianco */
  if(/peso di lavoro/i.test(t)){
    const ha=/[\u2212\-]\s*\d+\s*%/.test(t), base=pesoLavoro(bk,k,i);
    let h=campo("W_"+k+"_"+i,"kg",78);
    if(ha) h+=' <span class="freccia">\u2192</span> <b>'+((isFinite(base)&&base>0)?kg(base*sconto(t)):'\u2014')+'</b>';
    return h+'<span class="raw">'+t+'</span>';
  }
  /* % del test, anche a range */
  if((m=t.match(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*%\s*del test/i))){
    if(!isFinite(T)||T<=0) return '<span class="wait">dopo il test</span><span class="raw">'+t+'</span>';
    const a=parseFloat(m[1].replace(",",".")), bb=m[2]?parseFloat(m[2].replace(",",".")):null;
    return (bb?(f(Math.round(T*a/100*10)/10)+'–'+kg(T*bb/100)):kg(T*a/100))+'<span class="raw">'+t+'</span>';
  }
  /* % del top: il top lo scrive lui */
  if((m=t.match(/(\d+(?:[.,]\d+)?)\s*%\s*del\s*(top|mav)/i))){
    const tk="RK_"+k+"_0", tv=num(state[tk]), pct=parseFloat(m[1].replace(",","."));
    const out=(isFinite(tv)&&tv>0)?kg(tv*pct/100):'<span class="wait">dopo il top</span>';
    return '<span class="topout" data-k="'+tk+'" data-pct="'+pct+'">'+out+'</span><span class="raw">'+t+'</span>';
  }
  /* RPE: scrive lui il peso che ha trovato */
  if(/^RPE\s*\d/i.test(t)||/^@\s*\d/.test(t)){
    const kk="RK_"+k+"_"+i;
    return '<span class="at">'+t.replace(/^RPE\s*/i,"@")+'</span> '+campo(kk,"kg",72)+'<span class="raw">peso trovato a '+t+'</span>';
  }
  /* un numero secco: sono kg */
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*(kg)?$/i))) return f(parseFloat(m[1].replace(",",".")))+' kg';
  /* testo libero */
  return '<span class="wait">'+t+'</span>';
}

/* ---------- schemi ---------- */
function etich(rp){rp=String(rp||"").trim().toUpperCase();
  if(!rp||rp==="—") return "";
  if(/^\d+\s*S$/.test(rp)||/^\d+\s*"$/.test(rp)) return "tenuta";
  if(/^\d+\s*'$/.test(rp)||/^\d+\s*MIN/.test(rp)) return "minuti";
  if(rp==="MAX"||rp==="AMRAP") return "";
  return rp==="1"?"colpo":"colpi"}
function isMax(rp){rp=String(rp||"").trim().toUpperCase();return /^(MAX|AMRAP)(\s*(S|"|''|SEC|TEMPO))?$/.test(rp)}
function isMaxTempo(rp){rp=String(rp||"").trim().toUpperCase();return /^(MAX|AMRAP)\s*(S|"|''|SEC|TEMPO)$/.test(rp)}
function isMezzoMax(rp){rp=String(rp||"").trim().toUpperCase();return /^MAX\s*(\/\s*2|\u00bd)$/.test(rp)||/^MET[AÀ]\s*(DEL)?\s*MAX$/.test(rp)}
function ultimoMax(bk){
  /* l'ultimo MAX segnato in questo esercizio, in qualunque settimana */
  let best=null;
  Object.keys(state).forEach(function(k){
    if(k.indexOf("MX_"+bk+"_")!==0) return;
    const v=String(state[k]||"").match(/\d+(?:[.,]\d+)?/); if(!v) return;
    const n=parseFloat(v[0].replace(",",".")); if(isFinite(n)) best=(best===null?n:Math.max(best,n));
  });
  return best;
}
function colpiHTML(p,k,i,bk){
  if(isMaxTempo(p.rp)) return '<span class="n"><b>MAX</b><em>secondi</em></span>'+
    '<span class="mx">'+campo("MX_"+k+"_"+i,"45, 40, 38",92)+'<em>secondi fatti</em></span>';
  if(isMax(p.rp)) return '<span class="n"><b>MAX</b><em>colpi</em></span>'+
    '<span class="mx">'+campo("MX_"+k+"_"+i,"11, 10, 9",92)+'<em>colpi fatti</em></span>';
  if(isMezzoMax(p.rp)){const u=bk?ultimoMax(bk):null;
    return '<span class="n"><b>'+(u!==null?f(Math.round(u/2)):'\u00bd')+'</b><em>'+(u!==null?'met\u00e0 del MAX':'met\u00e0 del tuo MAX')+'</em></span>';}
  const l=etich(p.rp);
  return l?'<span class="n"><b>'+p.rp+'</b><em>'+l+'</em></span>':'';
}
function schema(p,k,i,bk){
  const col=colpiHTML(p,k,i,bk);
  return '<span class="n"><b>'+p.se+'</b><em>serie</em></span>'+(col?'<span class="x">×</span>'+col:'');
}

/* ---------- fatica percepita ---------- */
const FPC=[[40,16,99],[40,20,96],[39,24,92],[39,28,87],[38,33,80],[37,38,72],[36,44,62],[35,50,52],[34,54,42],[33,58,33]];
function fcol(n){const c=FPC[n-1];return "hsl("+c[0]+" "+c[1]+"% "+c[2]+"%)"}
function fbord(n){const c=FPC[n-1];return "hsl("+c[0]+" "+Math.min(c[1]+10,70)+"% "+Math.max(c[2]-9,14)+"%)"}
function fink(n){return FPC[n-1][2]<58?"#fff":"#23232A"}
let FPT={};
function paintFp(box,v,anim){
  const kids=box.children, key=box.dataset.k||"";
  if(FPT[key]) FPT[key].forEach(clearTimeout); FPT[key]=[];
  function set(i){const b=kids[i],n=i+1;b.style.background=fcol(n);b.style.borderColor=fbord(n);b.style.color=fink(n);b.className=(n===v)?"on sel":"on"}
  function clr(i){const b=kids[i];b.style.background="";b.style.borderColor="";b.style.color="";b.className=""}
  for(let i=v;i<10;i++) clr(i);
  for(let i=0;i<v;i++){ if(anim) FPT[key].push(setTimeout(function(){set(i)},i*55)); else set(i); }
}
function setFp(k,n,el){const key="fp_"+k;state[key]=(String(state[key])===String(n))?"":n;save();
  paintFp(el.parentNode,parseInt(state[key])||0,true);segnaManda();}
function feedback(k,r){
  let sc='';for(let n=1;n<=10;n++) sc+='<button type="button" data-fp="'+k+'" data-n="'+n+'">'+n+'</button>';
  return '<div class="fp"><span class="lb">Fatica percepita</span><div class="sc" data-k="'+k+'">'+sc+'</div>'+
    '<div class="ends"><span>leggera</span><span>massima</span></div></div>'+
    '<div class="app"><span>Note</span><input type="text" data-k="ap_'+k+'" value="'+
    esc(state["ap_"+k]!==undefined?state["ap_"+k]:(r.ap||""))+'"></div>';
}

/* ---------- riferimenti dentro l'esercizio ---------- */
function howTo(rm){
  const n=(String(rm).match(/[\d–\-]+/)||[""])[0].replace("–","-");
  const uno=n.indexOf("-")<0, art=(n==="8"||n==="11"||n==="18")?"gli":"i";
  return '<b>Devi trovare il massimo peso con cui riesci a fare '+n+' colpi.</b> Parti da un peso leggero e fai '+n+
   ' colpi. Aumenta il peso un po’ alla volta, sempre serie da '+n+', fino a quando arrivi al peso che riesci ancora '+
   'a completare pulito. Se sali e '+(uno?art:"i")+' '+n+' colpi non li chiudi, il tuo '+rm+' è il peso di prima. Di norma ci arrivi in 3-5 serie.';
}
function riferimenti(b,bk,sett){
  let h=''; const rm=testDi(b), tw=settDelTest(b);
  if(rm){
    const v=state["T_"+bk]===undefined?"":state["T_"+bk];
    if(!sett||sett===tw||!v){
      h+='<div class="tbx"><span class="lb">Il tuo '+rm+'</span><input type="text" inputmode="decimal" data-k="T_'+bk+
        '" value="'+esc(v)+'" placeholder="—"><span class="u">kg</span>'+
        '<span class="hint">da questo numero escono tutti i carichi di '+b.nome.toLowerCase()+' del blocco</span>'+
        '<details class="how"'+(v?'':' open')+'><summary>Come si trova il '+rm+'</summary><p>'+howTo(rm)+'</p></details></div>';
    }
  }
  return h;
}

/* ---------- il top del ramping: stessa fascia del test RM ---------- */
function rpeDi(t){const m=String(t||"").match(/(?:RPE|@)\s*(\d+(?:[.,]5)?)/i);return m?parseFloat(m[1].replace(",",".")):null}
function fasciaTop(p,k,r){
  const rpe=rpeDi(p.ca), colpi=String(p.rp||"").replace(/\D/g,"")||"pochi";
  const canna=rpe!==null?Math.max(0,Math.round(10-rpe)):null;
  const nc=colpi==="pochi"?"":(colpi==="1"?" 1 colpo":" "+colpi+" colpi");
  const lab='Il tuo top'+nc+(rpe!==null?' @'+f(rpe):'');
  const kk="RK_"+k+"_0", v=state[kk]||"";
  const how='<b>Devi trovare il peso con cui fai '+colpi+' colpi'+(canna!==null?' lasciandone '+canna+' in canna':'')+'.</b> '+
    'Parti da un peso leggero e fai '+colpi+' colpi. Aumenta il peso un po\u2019 alla volta, sempre serie da '+colpi+'. '+
    (canna!==null?'Quando una serie ti lascia '+(canna===1?'1 colpo':canna+' colpi')+' in canna \u2014 fatica della serie '+f(rpe)+' su 10 \u2014 quello \u00e8 il tuo top: scrivilo qui. '
                  :'Quando arrivi al peso giusto per oggi, quello \u00e8 il tuo top: scrivilo qui. ')+
    'Di norma ci arrivi in 3-5 serie.';
  return '<div class="tbx dentro"><span class="lb">'+lab+'</span>'+
    '<input type="text" inputmode="decimal" data-k="'+kk+'" value="'+esc(v)+'" placeholder="\u2014"><span class="u">kg</span>'+
    '<span class="hint">da questo peso escono le serie dopo</span>'+
    '<details class="how"'+(v?'':' open')+'><summary>Come si trova il top</summary><p>'+how+'</p></details></div>';
}

/* ---------- la riga ---------- */
function notaCoach(t){return String(t||"").replace(/\b(in|negli|nella|su(?:gli)?)\s+appunti\b/gi,"nelle note").replace(/\bappunti\b/g,"note")}
function rigaHTML(r,b,bk,k,sett){
  const ts=tipoSerie(r.se), pz=parti(r), nomi=nomiParti(b,pz.length);
  const recLab=(ts.t==="giri"&&!/giro|giri|onda|onde/i.test(r.rec||""))?('Rec tra '+(ts.parola==="onde"?'le onde':'i giri')):'Rec';
  const pill=r.rec?'<span class="rec"><em>'+recLab+'</em>'+r.rec+'</span>':'';
  const car=function(p,i){return '<div class="car" data-car="'+k+'_'+i+'">'+risolvi(p.ca,bk,b,k,i)+'</div>'};
  let h='<div class="wk">'+(sett?'':'<div class="s">Settimana '+String(r.s).replace(/\D/g,"")+'</div>');

  if(ts.t==="nessuna"){
    /* cardio, mobilita', lavori a tempo: una riga di testo */
    const rp=String(r.rp||"").trim(), ca=String(r.ca||"").trim();
    h+='<div class="sch">'+(rp&&rp!=="—"?'<span class="n"><b>'+rp+'</b><em>'+etich(rp)+'</em></span>':'<span class="libera">senza serie</span>')+pill+'</div>';
    if(ca&&ca!=="—") h+=car(pz[0],0);
  }
  else if(ts.t==="giri"){
    h+='<div class="recw">'+pill+'</div>';
    h+='<div class="giro"><div class="gt">Ripeti <b>'+ts.n+'</b> volte'+(ts.parola==="onde"?' <em>('+ts.n+' onde)</em>':'')+'</div>';
    pz.forEach(function(p,i){
      h+='<div class="gp">'+(nomi?'<span class="gn">'+nomi[i]+'</span>':'')+
         '<div class="gl"><div class="sch">'+colpiHTML(p,k,i,bk)+'</div>'+car(p,i)+'</div></div>';
    });
    h+='</div>';
    if(ts.extra){const p=pz[pz.length-1];
      h+='<div class="poi">poi</div><div class="parte"><div class="sch">'+schema({se:ts.extra,rp:p.rp},k,pz.length,bk)+'</div>'+car(p,pz.length)+'</div>';}
  }
  else if(ts.t==="ramp"){
    const p0=pz[0];
    h+=fasciaTop(p0,k,r)+'<div class="recw">'+pill+'</div>';
    const resto=pz.slice(1);
    if(ts.extra||resto.length){
      const p=resto[0]||p0, nse=ts.extra||p.se;
      h+='<div class="parte"><div class="gl"><div class="sch">'+schema({se:nse,rp:p.rp},k,1,bk)+'</div>'+car(p,1)+'</div></div>';
    }
  }
  else if(ts.t==="n"){
    h+='<div class="recw">'+pill+'</div>';
    const p0=pz[0];
    h+='<div class="ramp"><div class="gt">Serie <em>quante ne servono</em></div>'+
       '<div class="gl"><div class="sch">'+colpiHTML(p0,k,0,bk)+'</div>'+car(p0,0)+'</div>'+
       '<div class="fatte"><span>Serie fatte</span>'+campo("SF_"+k,"n.",64)+'</div></div>';
  }
  else if(pz.length>1){
    h+=(r.rec?'<div class="recw">'+pill+'</div>':'');
    h+=pz.map(function(p,i){return '<div class="parte">'+(nomi?'<span class="gn">'+nomi[i]+'</span>':'')+
      '<div class="gl"><div class="sch">'+schema(p,k,i,bk)+'</div>'+car(p,i)+'</div></div>'}).join('<div class="poi">poi</div>');
  }
  else {
    h+='<div class="sch">'+schema(pz[0],k,0,bk)+pill+'</div>'+car(pz[0],0);
  }
  if(r.es) h+='<div class="esec">'+r.es+'</div>';
  if(/EMOM/i.test(String(r.rec||"")+" "+String(b.t||"")+" "+String(r.es||""))){
    const minuti=parseInt(String(r.se).match(/\d+/)||0)||0;
    if(minuti) h+='<div class="emom" id="emom_'+k+'"><div class="ed"><b>\u2014</b><em>EMOM '+minuti+'\u2032</em></div>'+
      '<button type="button" class="eb" data-emom="'+k+'" data-min="'+minuti+'">Avvia EMOM</button>'+
      '<span class="evol">Volume alto e silenzioso tolto: il beep usa l\u2019audio del telefono.</span></div>';
  }
  if(r.n) h+='<div class="nota">'+notaCoach(r.n)+'</div>';
  return h+feedback(k,r)+'</div>';
}

/* ---------- EMOM: 10" per mettersi sotto, poi un beep a ogni minuto ---------- */
let EMOMT=null, ACTX=null;
function beep(n,freq){
  /* onda quadra, due toni sovrapposti, compressore a valle: il massimo che un telefono tira fuori */
  try{
    if(!ACTX) ACTX=new (window.AudioContext||window.webkitAudioContext)();
    if(ACTX.state==="suspended") ACTX.resume();
    const comp=ACTX.createDynamicsCompressor();
    comp.threshold.value=-6; comp.knee.value=0; comp.ratio.value=20; comp.attack.value=0.001; comp.release.value=0.05;
    const out=ACTX.createGain(); out.gain.value=1.0; comp.connect(out); out.connect(ACTX.destination);
    for(let i=0;i<n;i++){
      const t=ACTX.currentTime+i*0.42;
      [freq||1760,(freq||1760)*1.5].forEach(function(fr){
        const o=ACTX.createOscillator(), g=ACTX.createGain();
        o.type="square"; o.frequency.value=fr; o.connect(g); g.connect(comp);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(1.0,t+0.008);
        g.gain.setValueAtTime(1.0,t+0.28); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
        o.start(t); o.stop(t+0.36);
      });
    }
  }catch(e){}
  try{if(navigator.vibrate) navigator.vibrate(n===1?250:[250,150,250,150,250])}catch(e){}
  lampo(n);
}
function lampo(n){
  let el=document.getElementById("lampo");
  if(!el){el=document.createElement("div");el.id="lampo";document.body.appendChild(el)}
  let c=0;
  (function uno(){ el.className="on"; setTimeout(function(){el.className="";if(++c<n)setTimeout(uno,140)},260) })();
}
function emomToggle(k,min,btn){
  if(EMOMT&&EMOMT.k===k){emomStop();return}
  emomStop();
  const box=document.getElementById("emom_"+k); if(!box) return;
  const disp=box.querySelector(".ed");
  beep(1,1175);                                  /* sblocca l'audio col tocco */
  let wl=null; try{if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){wl=w}).catch(function(){})}catch(e){}
  const t0=Date.now(), prep=10; let lastMin=-1, lastPrep=-1;
  btn.textContent="Ferma"; btn.className="eb on";
  function tick(){
    const s=(Date.now()-t0)/1000;
    if(s<prep){
      const r=Math.ceil(prep-s);
      if(r<=3&&r!==lastPrep){lastPrep=r;beep(1,1175)}
      disp.innerHTML='<b>'+r+'</b><em>mettiti sotto</em>'; return;
    }
    const e=s-prep, m=Math.floor(e/60), sec=Math.floor(e%60);
    if(m>=min){ disp.innerHTML='<b>FINE</b><em>'+min+' minuti fatti</em>'; beep(3,1760); emomStop(true); return; }
    if(m!==lastMin){lastMin=m;beep(m===0?2:1,1760)}
    disp.innerHTML='<b>'+(m+1)+'<small>/'+min+'</small></b><em>minuto</em><span class="es">'+(sec<10?"0":"")+sec+'\u2033</span>';
  }
  EMOMT={k:k,iv:setInterval(tick,200),btn:btn,disp:disp,min:min,getWl:function(){return wl}};
  tick();
}
function emomStop(fine){
  if(!EMOMT) return;
  clearInterval(EMOMT.iv);
  try{const w=EMOMT.getWl(); if(w) w.release()}catch(e){}
  EMOMT.btn.textContent="Avvia EMOM"; EMOMT.btn.className="eb";
  if(!fine) EMOMT.disp.innerHTML='<b>\u2014</b><em>EMOM '+EMOMT.min+'\u2032</em>';
  EMOMT=null;
}

/* ---------- riepilogo per il coach ---------- */
function segnato(){
  const out=[];
  GIORNI.forEach(function(g){g.blocks.forEach(function(b,bi){
    const bk=g.id+"_"+bi;
    const T=state["T_"+bk];
    if(T&&String(T).trim()) out.push({g:g.id,nome:b.nome,riga:testDi(b)+": "+T+" kg"});
    b.rows.forEach(function(r,ri){
      const k=bk+"_"+ri, pezzi=[];
      const fp=state["fp_"+k], ap=state["ap_"+k], sf=state["SF_"+k];
      if(sf) pezzi.push("serie fatte "+sf);
      const nomi=nomiBlocco(b);
      for(let i=0;i<6;i++){const mx=state["MX_"+k+"_"+i], rk=state["RK_"+k+"_"+i], w=state["W_"+k+"_"+i];
        const chi=nomi&&nomi[i]?nomi[i].toLowerCase()+" ":"";
        if(mx) pezzi.push(chi+"MAX: "+mx); if(rk) pezzi.push(chi+"a RPE: "+rk+" kg"); if(w) pezzi.push(chi+"peso usato "+w+" kg");}
      if(fp) pezzi.push("fatica "+fp+"/10");
      if(ap&&String(ap).trim()) pezzi.push(String(ap).trim());
      if(pezzi.length) out.push({g:g.id,nome:r.s+" "+b.nome,riga:pezzi.join(" — ")});
    });
  })});
  return out;
}
function segnaManda(){const n=segnato().length,b=document.getElementById("manda");if(!b)return;
  b.className="manda"+(n?"":" vuoto");
  b.textContent=n?("Manda al coach ("+(n===1?"1 cosa segnata":n+" cose segnate")+")"):"Non hai ancora segnato niente";}
function testo(){
  const r=segnato(); if(!r.length) return "";
  let t=TITOLO+" — quello che ho segnato\n"; const per={};
  r.forEach(function(x){(per[x.g]=per[x.g]||[]).push(x)});
  Object.keys(per).sort().forEach(function(g){t+="\nGIORNO "+g+"\n";per[g].forEach(function(x){t+="• "+x.nome+" — "+x.riga+"\n"})});
  return t;
}
function manda(){const t=testo();if(!t){alert("Non hai ancora segnato niente.");return}
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");}

/* ---------- selettori e disegno ---------- */
let sel=1, dsel="";
const chips=document.getElementById("chips"), dchips=document.getElementById("dchips");
SETT.forEach(function(w){const b=document.createElement("button");b.textContent="S"+w;b.onclick=function(){sel=w;draw()};chips.appendChild(b)});
(function(){const b=document.createElement("button");b.className="all";b.textContent="TUTTE";b.onclick=function(){sel=0;draw()};chips.appendChild(b)})();
GIORNI.forEach(function(g){const b=document.createElement("button");b.textContent=g.id;b.onclick=function(){dsel=(dsel===g.id?"":g.id);draw()};dchips.appendChild(b)});
(function(){const b=document.createElement("button");b.className="all";b.textContent="TUTTI";b.onclick=function(){dsel="";draw()};dchips.appendChild(b)})();
function nserie(r){const ts=tipoSerie(r.se);if(ts.t!=="num")return 0;const m=String(r.se).match(/\d+/g);return m?m.reduce(function(a,x){return a+parseInt(x)},0):0}
function settimanaDi(r){return parseInt(String(r.s).replace(/\D/g,""))||0}

function draw(){
  emomStop();
  [].forEach.call(chips.children,function(b,i){b.setAttribute("aria-pressed",(i<SETT.length&&SETT[i]===sel)||(i===SETT.length&&sel===0)?"true":"false")});
  [].forEach.call(dchips.children,function(b,i){b.setAttribute("aria-pressed",(i<GIORNI.length&&GIORNI[i].id===dsel)||(i===GIORNI.length&&dsel==="")?"true":"false")});
  let h="";
  GIORNI.forEach(function(g){
    if(dsel&&g.id!==dsel) return;
    const righe=g.blocks.map(function(b){return b.rows.filter(function(r){return !sel||settimanaDi(r)===sel})});
    const ne=righe.filter(function(x){return x.length}).length; if(!ne) return;
    const ns=righe.reduce(function(a,rr){return a+rr.reduce(function(y,r){return y+nserie(r)},0)},0);
    h+='<div class="daybar">'+g.head+'<span>'+ne+' esercizi'+(sel&&ns?' · '+ns+' serie':'')+'</span></div>';
    g.blocks.forEach(function(b,bi){
      const bk=g.id+"_"+bi, rr=b.rows.filter(function(r){return !sel||settimanaDi(r)===sel}); if(!rr.length) return;
      if(b.demo) h+='<div class="caso">'+b.demo+'</div>';
      h+='<div class="ex"><h3>'+b.nome+(b.ruolo?'<em>'+b.ruolo+'</em>':'')+'</h3>'+riferimenti(b,bk,sel);
      rr.forEach(function(r){h+=rigaHTML(r,b,bk,bk+"_"+b.rows.indexOf(r),sel)});
      h+='</div>';
    });
  });
  document.getElementById("out").innerHTML=h||'<p class="note">Niente da mostrare.</p>';
  document.querySelectorAll(".sc").forEach(function(box){paintFp(box,parseInt(state["fp_"+box.dataset.k])||0,false)});
  document.querySelectorAll("[data-emom]").forEach(function(b){if(b.dataset.bound)return;b.dataset.bound=1;
    b.addEventListener("click",function(e){const t=e.currentTarget;emomToggle(t.dataset.emom,parseInt(t.dataset.min),t)})});
  document.querySelectorAll("[data-fp]").forEach(function(b){if(b.dataset.bound)return;b.dataset.bound=1;
    b.addEventListener("click",function(e){const t=e.currentTarget;setFp(t.dataset.fp,parseInt(t.dataset.n),t)})});
  document.querySelectorAll("input[data-k]").forEach(function(i){if(i.dataset.bound)return;i.dataset.bound=1;
    i.addEventListener("input",function(e){const kk=e.target.dataset.k;state[kk]=e.target.value;save();
      if(/^(T_|W_)/.test(kk)) ridipingi(); if(/^RK_/.test(kk)) ridipingiTop(kk); segnaManda();})});
  segnaManda();
}
function ridipingi(){
  GIORNI.forEach(function(g){g.blocks.forEach(function(b,bi){const bk=g.id+"_"+bi;
    b.rows.forEach(function(r,ri){const k=bk+"_"+ri, pz=parti(r), ts=tipoSerie(r.se);
      document.querySelectorAll('[data-car^="'+k+'_"]').forEach(function(nd){
        const i=parseInt(nd.dataset.car.slice(k.length+1))||0;
        const p=pz[Math.min(i,pz.length-1)];
        if(nd.querySelector("input")){
          const bb=nd.querySelector("b"), base=pesoLavoro(bk,k,i), c=String(p.ca||"");
          if(bb&&/peso di lavoro/i.test(c)) bb.textContent=(isFinite(base)&&base>0)?kg(base*sconto(c)):"\u2014";
          return;
        }
        nd.innerHTML=risolvi(p.ca,bk,b,k,i);
      });
    });
  })});
}
function ridipingiTop(kk){
  document.querySelectorAll('.topout[data-k="'+kk+'"]').forEach(function(e){
    const tv=num(state[kk]), pct=parseFloat(e.dataset.pct);
    e.innerHTML=(isFinite(tv)&&tv>0)?kg(tv*pct/100):'<span class="wait">dopo il top</span>';});
}
draw();

/* ---------- app installabile ---------- */
if(typeof LETTURA==="undefined") var LETTURA=false;
if("serviceWorker" in navigator) window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.update();
    reg.addEventListener("updatefound",function(){
      const nuovo=reg.installing; if(!nuovo) return;
      nuovo.addEventListener("statechange",function(){
        if(nuovo.state==="installed"&&navigator.serviceWorker.controller) avvisaVersione();
      });
    });
  }).catch(function(){});
  let ricaricato=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(ricaricato)return; ricaricato=true; location.reload();
  });
});
function avvisaVersione(){
  const e=document.getElementById("inst"); if(!e) return;
  e.className="inst"; e.style.display="block";
  e.innerHTML='<b>C’è una versione nuova della scheda.</b>'+
    '<div class="riga"><button onclick="location.reload()">Aggiorna adesso</button></div>';
}
/* se l'app resta aperta a lungo, controlla ogni tanto */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
    navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()}).catch(function(){});
});
let PROMPT=null;
function giaInstallata(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
}
const SVGGIU='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" '+
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px">'+
  '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>';
const SVGCOND='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" '+
  'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px">'+
  '<path d="M12 15V3"/><path d="m8 7 4-4 4 4"/>'+
  '<path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function inAppBrowser(){
  const u=navigator.userAgent;
  return /FBAN|FBAV|Instagram|Line\/|MicroMessenger|GSA\/|CriOS|FxiOS/i.test(u) ||
    (/iphone|ipad|ipod/i.test(u) && !/Safari\//.test(u));
}
function mostraInstalla(modo){
  if(giaInstallata()||LETTURA) return;
  const e=document.getElementById("inst"); if(!e) return;
  let chiusa=false;
  try{chiusa=!!localStorage.getItem("ncp-inst-min")}catch(x){}
  e.dataset.modo=modo;
  e.style.display="block";
  if(chiusa){
    e.className="inst mini";
    e.innerHTML='<button class="riapri" onclick="riapriInstalla()">'+SVGGIU+
      ' Installa l’app sul telefono</button>';
    return;
  }
  e.className="inst";
  let h='<b>Installa NC Performance.</b> Avrai l’icona sulla schermata principale: '+
    'si apre a tutto schermo, senza barre, e funziona anche quando non c’è rete.';
  h+='<div class="riga"><button onclick="'+(modo==="android"?"installa()":"comeInstallare()")+'">'+
    'Installa l’app</button>'+
    '<button class="no" onclick="minimizzaInstalla()">Per adesso no</button></div>'+
    '<div id="passi"></div>';
  e.innerHTML=h;
  if(modo==="ios") comeInstallare();
}
function riapriInstalla(){
  try{localStorage.removeItem("ncp-inst-min")}catch(x){}
  mostraInstalla(document.getElementById("inst").dataset.modo||"ios");
}
function minimizzaInstalla(){
  try{localStorage.setItem("ncp-inst-min","1")}catch(x){}
  mostraInstalla(document.getElementById("inst").dataset.modo||"ios");
}
function comeInstallare(){
  const p=document.getElementById("passi"); if(!p) return;
  let h='<ol class="passi">';
  if(inAppBrowser()){
    h+='<li><b>Prima apri questa pagina in Safari.</b> Da WhatsApp e dalle altre app '+
      'l’installazione non esiste: serve Safari.<br>'+
      '<span class="pic">Cerca in basso il tasto con i tre puntini o la bussola e scegli '+
      '«Apri in Safari». Oppure copia il link qui sotto e incollalo in Safari.</span>'+
      '<div class="riga"><button onclick="apriSafari()">Apri in Safari</button>'+
      '<button class="no" onclick="copiaLink(this)">Copia il link</button></div></li>';
  }
  h+='<li>In Safari tocca il tasto <b>Condividi</b> <span class="ic">'+SVGCOND+'</span>, '+
    'nella barra in fondo allo schermo.<br><span class="pic">Non la vedi? Tocca una volta '+
    'il fondo dello schermo: la barra ricompare.</span></li>'+
    '<li>Scorri l’elenco e scegli <b>Aggiungi a Home</b> '+
    '<span class="pic">(in inglese: Add to Home Screen)</span></li>'+
    '<li>Conferma in alto a destra</li></ol>';
  if(!inAppBrowser())
    h+='<div class="riga"><button class="no" onclick="copiaLink(this)">Copia il link</button></div>';
  p.innerHTML=h;
}
function copiaLink(b){
  const u=location.origin+location.pathname;
  function fatto(){b.textContent="Copiato ✓"; setTimeout(function(){b.textContent="Copia il link"},2500)}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(fatto).catch(function(){prompt("Copia il link:",u)});
  } else { prompt("Copia il link:",u) }
}
function apriSafari(){
  location.href="x-safari-"+location.origin+location.pathname;
}
function installa(){
  if(!PROMPT) return;
  PROMPT.prompt();
  PROMPT.userChoice.then(function(){PROMPT=null;
    const e=document.getElementById("inst"); if(e) e.style.display="none"});
}
function nienteInstalla(){
  try{localStorage.setItem("ncp-no-inst","1")}catch(e){}
  const e=document.getElementById("inst"); if(e) e.style.display="none";
}
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); PROMPT=e; mostraInstalla("android")});
(function(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  setTimeout(function(){
    if(!giaInstallata()&&!PROMPT) mostraInstalla(ios?"ios":"altro");
  },900);
})();
